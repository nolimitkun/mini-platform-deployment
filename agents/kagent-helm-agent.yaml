# yaml-language-server: $schema=schema.json
agent: kagent-helm-agent
project: kagent
owner: platform team
description: Lists, installs, upgrades and rolls back Helm releases (kagent's helm-agent).
runtime: {kind: kagent, name: helm-agent}
autonomy: autonomous
keys: [kagent-helm-agent]
models:
  allow: [deepseek-v4-pro]
secret: {name: kagent-helm-agent-agentgateway, field: OPENAI_API_KEY}
