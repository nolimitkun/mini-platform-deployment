# yaml-language-server: $schema=schema.json
agent: holmes
project: holmes
owner: platform team
description: Root-cause analysis of alerts and incidents from cluster state, logs, metrics, traces and Argo CD (HolmesGPT).
runtime: {kind: holmes, name: holmes}
# Holmes reads; tool calls that would change something wait for a human
# approval (HOLMES_APPROVAL_SIGNING_KEY).
autonomy: supervised
# The project's former key: the same id, so the key Holmes holds keeps working.
keys: [holmes]
models:
  allow: [deepseek-v4-pro]
mcp_tools: ["grafana_*"]
secret: {name: holmes-agentgateway, field: AGENTGATEWAY_API_KEY}
