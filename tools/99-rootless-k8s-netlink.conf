# Host prerequisite for the Minikube node's kube-proxy. Install with:
#
#   sudo cp tools/99-rootless-k8s-netlink.conf /etc/sysctl.d/
#   sudo sysctl --system
#
# kube-proxy runs the nftables proxier here (see --extra-config in
# scripts/deploy-minikube.sh), which hands the kernel each sync as a single
# netlink batch assembled in 128 KiB pages. nftables normally keeps a large
# batch under the socket limit by raising its own send buffer with
# SO_SNDBUFFORCE, but that option needs CAP_NET_ADMIN in the *initial* user
# namespace. Rootless Docker does not have it, so the call returns EPERM and
# the socket is left with the default sk_sndbuf -- net.core.wmem_default.
#
# At the stock 212992 that is room for exactly one batch page, so any sync
# whose netlink encoding passes 128 KiB fails with:
#
#   nftables sync failed: netlink: Error: Could not process rule: Message too long
#
# This platform crosses that at roughly 90 Services. The failure is quiet and
# partial rather than loud: rules already in the kernel keep forwarding, so
# nothing looks broken until a pod is recreated and kube-proxy cannot write the
# new endpoint -- at which point that one Service stops routing on its own.
#
# net.core.wmem_default lives in init_net and is not network-namespaced, so it
# is read-only from inside the node and has to be set here, on the host.
# 4 MiB buys 32 batch pages, 32x the headroom the default allows.
net.core.wmem_default = 4194304

# Not load-bearing for the above: nftables never calls plain SO_SNDBUF, so it
# is wmem_default alone that decides whether a batch fits. This is raised with
# it only so the ceiling on an explicit SO_SNDBUF is not left below the
# default, which would be an incoherent thing to leave behind in `sysctl -a`.
net.core.wmem_max = 4194304
