# Models a project may use beyond what its data class and placement allow.
# Owned by the platform team, not by the projects: each entry
# needs an owner and a reason, and names models from catalog/models.yaml.
exceptions:
  kagent:
    owner: platform team
    why: multi-step tool calling the single-GPU local model can't carry; cluster state and telemetry only
    models: [deepseek-v4-pro]
  holmes:
    owner: platform team
    why: "same as kagent: root-cause analysis over cluster state and telemetry"
    models: [deepseek-v4-pro]
