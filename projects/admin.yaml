# yaml-language-server: $schema=schema.json
project: admin
owner: platform team
description: For people testing and operating the gateway by hand.
data_class: public
keys: [admin]
mcp_tools: ["*"]
# People testing the gateway get the full model "auto" path: the semantic
# router's task class, then the best model admin may use for it.
routing: semantic
# People testing by hand: generous, but a runaway loop or a pricey model
# can't go unnoticed for long.
limits:
  requests_per_minute: 60
budget:
  usd_per_30_days: 25
