server:
  workers: 1
  config:
    query:
      maxMemory: 1GB

service:
  type: ClusterIP

# The starter catalog permits an immediate BI connectivity test from Superset.
# Replace or extend it with Iceberg, Hive, PostgreSQL, or object-store catalogs.
catalogs:
  tpch: |
    connector.name=tpch
    tpch.splits-per-node=4

jmx:
  enabled: true
  exporter:
    enabled: true
    configProperties: |-
      hostPort: localhost:{{ .Values.jmx.registryPort }}
      lowercaseOutputName: true
      lowercaseOutputLabelNames: true
      rules:
        - pattern: ".*"

serviceMonitor:
  enabled: false

# Trino bundles the OpenTelemetry SDK and traces query planning and execution
# once these are set (`tracing.enabled` comes from Airlift's
# TracingEnabledConfig, the exporter keys from its OpenTelemetryExporterConfig).
# `additionalConfigProperties` feeds both the coordinator and worker
# config.properties, so a query's spans cover the whole cluster rather than just
# the entry point.
additionalConfigProperties:
  - tracing.enabled=true
  - tracing.exporter.endpoint=http://alloy.mini-platform.svc.cluster.local:4317
  - tracing.exporter.protocol=grpc

