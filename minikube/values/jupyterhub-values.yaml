hub:
  authenticatePrometheus: false
  networkPolicy:
    enabled: true
  # Keycloak SSO, replacing z2jh's dummy authenticator (which accepted any
  # username with no password). There is no local fallback to preserve here.
  config:
    JupyterHub:
      authenticator_class: generic-oauth
    GenericOAuthenticator:
      client_id: jupyterhub
      oauth_callback_url: http://jupyterhub.test/hub/oauth_callback
      authorize_url: http://keycloak.test/realms/mini-platform/protocol/openid-connect/auth
      token_url: http://keycloak.test/realms/mini-platform/protocol/openid-connect/token
      userdata_url: http://keycloak.test/realms/mini-platform/protocol/openid-connect/userinfo
      login_service: Keycloak
      # Becomes the JupyterHub username, and therefore the singleuser server's
      # pod name suffix — preferred_username is the only claim guaranteed to be
      # both present and DNS-safe.
      username_claim: preferred_username
      scope:
        - openid
        - profile
        - email
        - groups
      claim_groups_key: groups
      # Required by oauthenticator whenever allowed_groups/admin_groups are
      # used: it refuses to start otherwise ("admin_groups requires
      # manage_groups to also be set"). It makes JupyterHub mirror the realm's
      # groups into its own group table on each login, which is also what keeps
      # membership changes in Keycloak taking effect here.
      manage_groups: true
      # Anyone outside these realm groups is refused at the hub, so a Keycloak
      # account alone is not enough to get a notebook server.
      allowed_groups:
        - platform-users
        - platform-admins
      admin_groups:
        - platform-admins
  # oauthenticator reads the client secret from the environment; keeping it out
  # of hub.config keeps it out of the rendered ConfigMap.
  extraEnv:
    - name: OAUTH_CLIENT_SECRET
      valueFrom:
        secretKeyRef:
          name: keycloak-sso
          key: JUPYTERHUB_CLIENT_SECRET

proxy:
  chp:
    networkPolicy:
      enabled: true
  traefik:
    networkPolicy:
      enabled: true
  service:
    type: ClusterIP

singleuser:
  networkPolicy:
    enabled: true

scheduling:
  userPlaceholder:
    enabled: false
