mode: standalone
replicas: 1
existingSecret: minio-root-credentials

persistence:
  enabled: true

service:
  type: ClusterIP

consoleService:
  type: ClusterIP

# Keycloak SSO for the console. The root credentials above keep working, both
# as break-glass and for the S3 API clients (MLflow, Langfuse) that have no
# browser to run an OIDC flow in.
#
# MinIO fetches configUrl once, during IAM init at startup. If that lookup
# fails it logs "Unable to initialize OpenID" and keeps serving without a
# provider — the console then reports loginStrategy `form` and shows no Keycloak
# button, for the life of the process. It never retries, which is what makes
# this worth a comment: the failure outlives whatever caused it, and everything
# else about MinIO looks healthy.
#
# Any transient at the wrong moment does it — Keycloak not up yet, the CoreDNS
# rollout deploy-minikube.sh performs, a pod sandbox being recreated. Both
# halves of the platform's answer are therefore about *when* MinIO starts, not
# about waiting longer: the app-of-apps syncs this release a wave after Keycloak
# so the initial rollout cannot lose that particular race, and the deploy script
# ends with ensure_minio_sso, which asks the console what it is offering and
# restarts MinIO if it came up blind.
#
# Neither covers a container that restarts later — after `minikube stop` /
# `minikube start`, say. The check and the remedy by hand:
#
#   kubectl -n mini-platform exec deploy/minio -- curl -s http://localhost:9001/api/v1/login
#   kubectl -n mini-platform rollout restart deploy/minio
#
# `"loginStrategy":"redirect"` means SSO is wired; `"form"` means it is not.
oidc:
  enabled: true
  configUrl: http://keycloak.test/realms/mini-platform/.well-known/openid-configuration
  clientId: minio
  existingClientSecretName: keycloak-sso
  existingClientSecretKey: MINIO_CLIENT_SECRET
  # MinIO authorizes from a claim naming one of its own policies rather than
  # from a group list, so the realm client hardcodes `policy: consoleAdmin`.
  # Narrowing this means adding a MinIO policy and mapping the realm role onto
  # it in the keycloak overlay.
  claimName: policy
  scopes: openid,profile,email,groups
  redirectUri: http://minio.test/oauth_callback
  displayName: Keycloak


metrics:
  serviceMonitor:
    enabled: false


# OPA policy bundles: the project registry's publisher writes both here, signed, and the OPA beside agentgateway
# downloads and verifies them. One write account and one read account,
# each scoped to the bucket; their secret keys come from Vault
# (minio-resources.yaml). Setting `users` also drops the chart's default
# console/console123 account from what the post-install job creates.
#
# Model weights and the model onboarding pipeline's buckets (model-serving
# chart). `models` holds every self-hosted model's weights, one write-once
# prefix per revision (models/<repo>/<revision>/), with object locking (and so
# versioning) on: an overwrite or delete leaves the published version in
# place. The pipeline publishes there after its scan; vLLM streams from it
# read-only. The other three are the pipeline's own: Argo's artifact
# repository and its results (argo-artifacts), its model registry's store
# (model-store) and its model pages (model-onboarding).
buckets:
  - name: opa-bundles
    policy: none
    purge: false
  - name: models
    policy: none
    purge: false
    objectlocking: true
  - name: argo-artifacts
    policy: none
    purge: false
  - name: model-store
    policy: none
    purge: false
  - name: model-onboarding
    policy: none
    purge: false
policies:
  - name: opa-bundles-write
    statements:
      - resources: ["arn:aws:s3:::opa-bundles/*"]
        actions: ["s3:GetObject", "s3:PutObject", "s3:DeleteObject", "s3:AbortMultipartUpload", "s3:ListMultipartUploadParts"]
      - resources: ["arn:aws:s3:::opa-bundles"]
        actions: ["s3:GetBucketLocation", "s3:ListBucket", "s3:ListBucketMultipartUploads"]
  - name: opa-bundles-read
    statements:
      - resources: ["arn:aws:s3:::opa-bundles/*"]
        actions: ["s3:GetObject"]
      - resources: ["arn:aws:s3:::opa-bundles"]
        actions: ["s3:GetBucketLocation", "s3:ListBucket"]
  # The onboarding pipeline: publishes weights (write, never delete: a
  # published revision is permanent), and reads and writes its own buckets.
  - name: model-onboarding
    statements:
      - resources: ["arn:aws:s3:::models/*"]
        actions: ["s3:GetObject", "s3:PutObject", "s3:AbortMultipartUpload", "s3:ListMultipartUploadParts"]
      - resources: ["arn:aws:s3:::argo-artifacts/*", "arn:aws:s3:::model-store/*", "arn:aws:s3:::model-onboarding/*"]
        actions: ["s3:GetObject", "s3:PutObject", "s3:DeleteObject", "s3:AbortMultipartUpload", "s3:ListMultipartUploadParts"]
      - resources: ["arn:aws:s3:::models", "arn:aws:s3:::argo-artifacts", "arn:aws:s3:::model-store", "arn:aws:s3:::model-onboarding"]
        actions: ["s3:GetBucketLocation", "s3:ListBucket", "s3:ListBucketMultipartUploads", "s3:ListBucketVersions"]
  # vLLM in the serving namespaces: read the weights, nothing else.
  - name: models-read
    statements:
      - resources: ["arn:aws:s3:::models/*"]
        actions: ["s3:GetObject"]
      - resources: ["arn:aws:s3:::models"]
        actions: ["s3:GetBucketLocation", "s3:ListBucket"]
users:
  # The writers' account. Named after OPA Control Plane, its first user; the
  # name stays so existing credentials keep working.
  - accessKey: ocp
    existingSecret: opa-bundles-writer
    existingSecretKey: AWS_SECRET_ACCESS_KEY
    policy: opa-bundles-write
  - accessKey: opa
    existingSecret: opa-bundles-reader
    existingSecretKey: AWS_SECRET_ACCESS_KEY
    policy: opa-bundles-read
  - accessKey: model-onboarding
    existingSecret: minio-model-onboarding
    existingSecretKey: secret-key
    policy: model-onboarding
  - accessKey: model-serving
    existingSecret: minio-model-serving
    existingSecretKey: AWS_SECRET_ACCESS_KEY
    policy: models-read
