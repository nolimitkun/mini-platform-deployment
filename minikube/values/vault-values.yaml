global:
  # Starter deployment uses in-cluster HTTP. Configure TLS before exposing Vault.
  tlsDisable: true

# Existing workloads consume Kubernetes Secrets populated by Vault Secrets Operator.
injector:
  enabled: false

server:
  enabled: true
  standalone:
    enabled: true
    # NOTE: the chart puts this in a ConfigMap with no checksum annotation on
    # the StatefulSet, so editing it does not roll the pod — Argo CD reports
    # Synced while Vault keeps serving the old config. Applying a change here
    # means deleting vault-0 by hand and unsealing it again afterwards
    # (scripts/deploy-minikube.sh unseals on rerun). Fresh clusters are
    # unaffected: they come up with this config already in place.
    #
    # The chart default, with telemetry added. Vault's /v1/sys/metrics is a
    # normal authenticated API path, so an anonymous scrape gets 403 unless the
    # listener opts out — hence the telemetry stanza inside `listener`. The
    # top-level one keeps samples alive across a 30s scrape interval and drops
    # the per-host label, which on a single node only adds cardinality.
    config: |-
      ui = true

      listener "tcp" {
        tls_disable = 1
        address = "[::]:8200"
        cluster_address = "[::]:8201"
        telemetry {
          unauthenticated_metrics_access = "true"
        }
      }

      storage "file" {
        path = "/vault/data"
      }

      telemetry {
        prometheus_retention_time = "30s"
        disable_hostname = true
      }
  dataStorage:
    enabled: true
    size: 10Gi
  auditStorage:
    enabled: true
    size: 10Gi
  service:
    type: ClusterIP
  ingress:
    enabled: false

ui:
  enabled: true
  serviceType: ClusterIP
