vaultSecrets:
  # HolmesGPT's envFrom mounts and GitHub MCP credential: its LiteLLM key,
  # Grafana basic-auth pair for the Loki and Tempo toolsets, the API key its
  # own HTTP server authenticates callers with, and its direct Langfuse OTLP
  # authentication header. See
  # minikube/values/holmes-values.yaml for why the LiteLLM key is deliberately
  # not called OPENAI_API_KEY.
  - holmes-litellm
  - holmes-grafana
  - holmes-api
  - holmes-argocd
  - holmes-github
  - holmes-langfuse

# Helm 3 stores release records as Secrets. Scope that read access to the
# platform namespace instead of widening Holmes' upstream ClusterRole across
# the whole cluster. The built-in Helm toolset is read-only, but this Role does
# mean the Holmes ServiceAccount can read other Secrets in mini-platform; do
# not enable it in a namespace whose credentials Holmes must never see.
roles:
  - name: holmes-helm-release-reader
    rules:
      - apiGroups: [""]
        resources: ["secrets"]
        verbs: ["get", "list"]
roleBindings:
  - name: holmes-helm-release-reader
    roleName: holmes-helm-release-reader
    subjects:
      - kind: ServiceAccount
        name: holmes-holmes-service-account
        namespace: mini-platform

configMaps:
  - name: holmes-otel-context
    data:
      sitecustomize.py: |
        """Extract W3C context for Holmes without replacing the upstream image."""

        from fastapi import FastAPI
        from opentelemetry import propagate, trace
        from opentelemetry.trace import SpanKind


        class W3CTraceContextMiddleware:
            def __init__(self, app):
                self.app = app

            async def __call__(self, scope, receive, send):
                if scope.get("type") != "http":
                    await self.app(scope, receive, send)
                    return

                carrier = {
                    key.decode("latin-1"): value.decode("latin-1")
                    for key, value in scope.get("headers", ())
                }
                parent = propagate.extract(carrier=carrier)
                parent_span = trace.get_current_span(parent).get_span_context()
                if not parent_span.is_valid:
                    await self.app(scope, receive, send)
                    return

                method = scope.get("method", "HTTP")
                path = scope.get("path", "/")
                tracer = trace.get_tracer("holmesgpt.http")
                with tracer.start_as_current_span(
                    f"{method} {path}",
                    context=parent,
                    kind=SpanKind.SERVER,
                    attributes={
                        "http.request.method": method,
                        "url.path": path,
                    },
                ):
                    await self.app(scope, receive, send)


        if not getattr(FastAPI, "_holmes_w3c_context_enabled", False):
            original_init = FastAPI.__init__

            def traced_init(self, *args, **kwargs):
                original_init(self, *args, **kwargs)
                self.add_middleware(W3CTraceContextMiddleware)

            FastAPI.__init__ = traced_init
            FastAPI._holmes_w3c_context_enabled = True

routes:
  # The Service name carries the release name twice because the chart builds it
  # as `<release>-holmes`.
  - name: holmes
    host: holmes.test
    service: holmes-holmes
    port: 80
    # Deliberately not protected. Holmes has no browser UI — every route is
    # API, and it authenticates each request itself against HOLMES_API_KEY.
    # Forward-auth here would 302 every caller, exactly as it did to MLflow's
    # tracking API, while adding no protection the key does not already give.
