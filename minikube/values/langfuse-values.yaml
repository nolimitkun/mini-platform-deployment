langfuse:
  salt:
    secretKeyRef:
      name: langfuse-app-secrets
      key: salt
  encryptionKey:
    secretKeyRef:
      name: langfuse-app-secrets
      key: encryption-key
  nextauth:
    url: http://langfuse.test
    secret:
      secretKeyRef:
        name: langfuse-app-secrets
        key: nextauth-secret
  features:
    telemetryEnabled: false
  # Provision the tracing project using the same Vault-managed keys consumed by LiteLLM.
  additionalEnv:
    # ---- Keycloak SSO ------------------------------------------------------
    # AUTH_DISABLE_USERNAME_PASSWORD is left unset, so the headless init user
    # below remains a working local login.
    #
    # Langfuse's *named* Keycloak provider, not the generic AUTH_CUSTOM_* one,
    # and the difference is not cosmetic. Keycloak's token response carries two
    # non-standard fields, `refresh_expires_in` and `not-before-policy`, which
    # next-auth hands straight to the Prisma adapter's linkAccount() — and the
    # Account model has no such columns, so the insert dies with
    # PrismaClientValidationError and the browser lands back on
    # /auth/sign-in?error=Callback. Langfuse strips both, but only on the branch
    # guarded by `provider.endsWith("keycloak")`; registered as `custom` the
    # provider id is `custom` and the fix never fires. The id also fixes the
    # callback path to /api/auth/callback/keycloak on the realm client.
    - name: AUTH_KEYCLOAK_NAME
      value: Keycloak
    - name: AUTH_KEYCLOAK_CLIENT_ID
      value: langfuse
    - name: AUTH_KEYCLOAK_CLIENT_SECRET
      valueFrom:
        secretKeyRef:
          name: keycloak-sso
          key: LANGFUSE_CLIENT_SECRET
    - name: AUTH_KEYCLOAK_ISSUER
      value: http://keycloak.test/realms/mini-platform
    - name: AUTH_KEYCLOAK_SCOPE
      value: openid email profile
    # Lets the Keycloak identity attach to the init user's existing account
    # when the email matches, instead of failing as a duplicate — which is what
    # keeps the seeded org and project visible after the first SSO login.
    - name: AUTH_KEYCLOAK_ALLOW_ACCOUNT_LINKING
      value: "true"
    # ---- Project bootstrap -------------------------------------------------
    - name: LANGFUSE_INIT_ORG_ID
      value: mini-platform
    - name: LANGFUSE_INIT_ORG_NAME
      value: Mini Platform
    - name: LANGFUSE_INIT_PROJECT_ID
      value: litellm
    - name: LANGFUSE_INIT_PROJECT_NAME
      value: LiteLLM
    - name: LANGFUSE_INIT_PROJECT_PUBLIC_KEY
      valueFrom:
        secretKeyRef:
          name: litellm-langfuse
          key: LANGFUSE_PUBLIC_KEY
    - name: LANGFUSE_INIT_PROJECT_SECRET_KEY
      valueFrom:
        secretKeyRef:
          name: litellm-langfuse
          key: LANGFUSE_SECRET_KEY
    # Without an init user, the org/project are created for API access but no
    # UI account is a member of the org, so the dashboard appears empty.
    - name: LANGFUSE_INIT_USER_EMAIL
      valueFrom:
        secretKeyRef:
          name: langfuse-init-user
          key: LANGFUSE_INIT_USER_EMAIL
    - name: LANGFUSE_INIT_USER_NAME
      valueFrom:
        secretKeyRef:
          name: langfuse-init-user
          key: LANGFUSE_INIT_USER_NAME
    - name: LANGFUSE_INIT_USER_PASSWORD
      valueFrom:
        secretKeyRef:
          name: langfuse-init-user
          key: LANGFUSE_INIT_USER_PASSWORD
  web:
    service:
      type: ClusterIP
      port: 3000
  ingress:
    enabled: false

# Langfuse uses dedicated stores; do not share gateway databases with tracing data.
postgresql:
  deploy: true
  auth:
    existingSecret: langfuse-postgresql
    secretKeys:
      userPasswordKey: password
      adminPasswordKey: password

redis:
  deploy: true
  host: langfuse-redis-primary
  auth:
    username: null
    existingSecret: langfuse-redis
    existingSecretPasswordKey: password

clickhouse:
  deploy: true
  replicaCount: 1
  resourcesPreset: none
  resources:
    requests:
      cpu: "1"
      memory: 2Gi
      ephemeral-storage: 50Mi
    limits:
      cpu: "2"
      memory: 4Gi
      ephemeral-storage: 4Gi
  auth:
    existingSecret: langfuse-clickhouse
    existingSecretKey: password

s3:
  deploy: true
  bucket: langfuse
  accessKeyId:
    secretKeyRef:
      name: langfuse-s3
      key: root-user
  secretAccessKey:
    secretKeyRef:
      name: langfuse-s3
      key: root-password
  auth:
    existingSecret: langfuse-s3
    rootUserSecretKey: root-user
    rootPasswordSecretKey: root-password
