# Loki in monolithic (SingleBinary) mode with filesystem storage — the smallest
# shape that still speaks the full Loki API. The scalable modes and the
# memcached caches the chart enables by default are far past what a one-node
# Minikube can carry, so they are all turned off below.
deploymentMode: SingleBinary

loki:
  auth_enabled: false
  commonConfig:
    # Single replica: nothing to replicate to.
    replication_factor: 1
  storage:
    type: filesystem
    # `type: filesystem` only skips the object-store branch of the chart's
    # storage helper; the directories still have to be named explicitly. Only
    # these two keys exist on common.FilesystemConfig — admin_api_directory is
    # GEL-only and OSS Loki refuses to parse it.
    filesystem:
      chunks_directory: /var/loki/chunks
      rules_directory: /var/loki/rules
  # A real install must pin its own schema (the chart ships none). v13/tsdb is
  # the current recommendation.
  schemaConfig:
    configs:
      - from: "2024-04-01"
        store: tsdb
        object_store: filesystem
        schema: v13
        index:
          prefix: index_
          period: 24h
  limits_config:
    retention_period: 168h
    # Powers the "Log volume" histogram in Grafana's Explore view.
    volume_enabled: true
    allow_structured_metadata: true
  compactor:
    working_directory: /var/loki/compactor
    retention_enabled: true
    delete_request_store: filesystem
  analytics:
    reporting_enabled: false

singleBinary:
  replicas: 1
  persistence:
    enabled: true
    size: 10Gi
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      memory: 1Gi

# Scalable-mode components: unused in SingleBinary mode, pinned to zero so a
# stray default cannot schedule them.
write:
  replicas: 0
read:
  replicas: 0
backend:
  replicas: 0

# The nginx gateway only exists to split read/write paths in scalable mode.
# Grafana and Alloy talk to the single binary Service directly.
gateway:
  enabled: false

# Memcached tiers — the chunks cache alone asks for 8Gi.
chunksCache:
  enabled: false
resultsCache:
  enabled: false

# Self-monitoring extras: a canary DaemonSet and a Helm test pod.
lokiCanary:
  enabled: false
test:
  enabled: false

# Chunk storage is on the local filesystem; no bundled MinIO needed.
minio:
  enabled: false
