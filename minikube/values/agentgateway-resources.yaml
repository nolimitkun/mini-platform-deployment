vaultSecrets:
  # One entry per key id: {"key": ..., "metadata": {"project": ..., "key_id": ...}}
  # (projects/*.yaml). The clients' own copies of their keys are mirrored from
  # agentgateway-client-keys onto each client's release.
  - agentgateway-api-keys
  # DeepSeek's key, sent as the Authorization header to api.deepseek.com.
  - agentgateway-deepseek

routes:
  # The OpenAI-compatible API, for clients outside the cluster. No browser
  # login in front: every request carries a client API key and passes OPA.
  - name: agentgateway
    host: agentgateway.test
    service: agentgateway-proxy
    port: 80
