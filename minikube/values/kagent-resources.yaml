vaultSecrets:
  # kagent's API key for the model gateway (project kagent's key, a copy out of the
  # project registry's key map, under the name its OpenAI client reads), and its
  # Grafana basic-auth pair for the Grafana MCP server (a mirror of Grafana's own).
  - name: kagent-agentgateway
    gatewayKey: kagent
    field: OPENAI_API_KEY
  - kagent-grafana
  # Each registered agent's own gateway key (its agent record's key and secret),
  # so OPA knows which agent is calling and applies its scope. The project
  # registry checks a new agent's record against these entries.
  # kagent-agentgateway stays for default-model-config, which agents created in
  # the UI use: they get the kagent project's scope until they are registered.
  - name: kagent-k8s-agent-agentgateway
    gatewayKey: kagent-k8s-agent
    field: OPENAI_API_KEY
  - name: kagent-helm-agent-agentgateway
    gatewayKey: kagent-helm-agent
    field: OPENAI_API_KEY
  - name: kagent-promql-agent-agentgateway
    gatewayKey: kagent-promql-agent
    field: OPENAI_API_KEY
  - name: kagent-observability-agent-agentgateway
    gatewayKey: kagent-observability-agent
    field: OPENAI_API_KEY

routes:
  - name: kagent
    host: kagent.test
    service: kagent-ui
    port: 8080
    # kagent ships no authentication whatsoever, so without this the chat UI —
    # and the cluster-mutating tools behind it — are open to anyone who can
    # reach the ingress.
    protectedPaths:
      - /

# One ModelConfig per registered kagent agent, the same as the chart's
# default-model-config but with the agent's own key; kagent-values.yaml points
# each agent's modelConfigRef here. The project registry checks a proposed
# kagent agent against the three on main, and CI (validate-gitops.sh) the seed's.
extraObjects:
  - apiVersion: kagent.dev/v1alpha2
    kind: ModelConfig
    metadata:
      name: kagent-k8s-agent-model
    spec:
      provider: OpenAI
      model: deepseek-v4-pro
      apiKeySecret: kagent-k8s-agent-agentgateway
      apiKeySecretKey: OPENAI_API_KEY
      openAI:
        baseUrl: http://agentgateway-proxy.mini-platform.svc.cluster.local/v1
  - apiVersion: kagent.dev/v1alpha2
    kind: ModelConfig
    metadata:
      name: kagent-helm-agent-model
    spec:
      provider: OpenAI
      model: deepseek-v4-pro
      apiKeySecret: kagent-helm-agent-agentgateway
      apiKeySecretKey: OPENAI_API_KEY
      openAI:
        baseUrl: http://agentgateway-proxy.mini-platform.svc.cluster.local/v1
  - apiVersion: kagent.dev/v1alpha2
    kind: ModelConfig
    metadata:
      name: kagent-promql-agent-model
    spec:
      provider: OpenAI
      model: deepseek-v4-pro
      apiKeySecret: kagent-promql-agent-agentgateway
      apiKeySecretKey: OPENAI_API_KEY
      openAI:
        baseUrl: http://agentgateway-proxy.mini-platform.svc.cluster.local/v1
  - apiVersion: kagent.dev/v1alpha2
    kind: ModelConfig
    metadata:
      name: kagent-observability-agent-model
    spec:
      provider: OpenAI
      model: deepseek-v4-pro
      apiKeySecret: kagent-observability-agent-agentgateway
      apiKeySecretKey: OPENAI_API_KEY
      openAI:
        baseUrl: http://agentgateway-proxy.mini-platform.svc.cluster.local/v1
