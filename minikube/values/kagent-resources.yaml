vaultSecrets:
  # kagent's API key for the model gateway, and its Grafana basic-auth pair for
  # the Grafana MCP server. Both are mirrors — the gateway and Grafana each
  # already own the underlying credential — written under the key names each
  # consumer expects.
  - kagent-agentgateway
  - kagent-grafana
  # Each registered agent's own gateway key (agents/kagent-*.yaml), so OPA
  # knows which agent is calling and applies its scope. kagent-agentgateway
  # stays for default-model-config, which agents created in the UI use: they
  # get the kagent project's scope until they are registered.
  - kagent-k8s-agent-agentgateway
  - kagent-helm-agent-agentgateway
  - kagent-promql-agent-agentgateway
  - kagent-observability-agent-agentgateway

routes:
  - name: kagent
    host: kagent.test
    service: kagent-ui
    port: 8080
    # kagent ships no authentication whatsoever, so without this the chat UI —
    # and the cluster-mutating tools behind it — are open to anyone who can
    # reach the ingress.
    protectedPaths:
      - /

# One ModelConfig per registered kagent agent, the same as the chart's
# default-model-config but with the agent's own key; kagent-values.yaml points
# each agent's modelConfigRef here. CI (validate-gitops.sh) checks the three stay in
# step with the kagent agents of the project registry's seed.
extraObjects:
  - apiVersion: kagent.dev/v1alpha2
    kind: ModelConfig
    metadata:
      name: kagent-k8s-agent-model
    spec:
      provider: OpenAI
      model: deepseek-v4-pro
      apiKeySecret: kagent-k8s-agent-agentgateway
      apiKeySecretKey: OPENAI_API_KEY
      openAI:
        baseUrl: http://agentgateway-proxy.mini-platform.svc.cluster.local/v1
  - apiVersion: kagent.dev/v1alpha2
    kind: ModelConfig
    metadata:
      name: kagent-helm-agent-model
    spec:
      provider: OpenAI
      model: deepseek-v4-pro
      apiKeySecret: kagent-helm-agent-agentgateway
      apiKeySecretKey: OPENAI_API_KEY
      openAI:
        baseUrl: http://agentgateway-proxy.mini-platform.svc.cluster.local/v1
  - apiVersion: kagent.dev/v1alpha2
    kind: ModelConfig
    metadata:
      name: kagent-promql-agent-model
    spec:
      provider: OpenAI
      model: deepseek-v4-pro
      apiKeySecret: kagent-promql-agent-agentgateway
      apiKeySecretKey: OPENAI_API_KEY
      openAI:
        baseUrl: http://agentgateway-proxy.mini-platform.svc.cluster.local/v1
  - apiVersion: kagent.dev/v1alpha2
    kind: ModelConfig
    metadata:
      name: kagent-observability-agent-model
    spec:
      provider: OpenAI
      model: deepseek-v4-pro
      apiKeySecret: kagent-observability-agent-agentgateway
      apiKeySecretKey: OPENAI_API_KEY
      openAI:
        baseUrl: http://agentgateway-proxy.mini-platform.svc.cluster.local/v1
