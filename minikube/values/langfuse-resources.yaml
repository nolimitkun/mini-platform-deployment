vaultSecrets:
  - langfuse-app-secrets
  - langfuse-postgresql
  - langfuse-redis
  - langfuse-clickhouse
  - langfuse-s3
  # Credentials for the headless init that provisions the starter org, project
  # and API keys, so no browser setup is needed on a fresh cluster.
  - langfuse-init-user
  # Shared with LiteLLM, which reads the same public/secret pair to send its
  # traces here. Declared on this side because Langfuse's init job is what
  # provisions the keys, and because it syncs three waves ahead of LiteLLM.
  - litellm-langfuse
  # Raw keys for the dedicated Holmes project. Only Langfuse's provisioning
  # job mounts this Secret; Holmes receives a derived Basic-auth header.
  - holmes-langfuse-project
  # Raw keys for the dedicated Open WebUI project. The provisioning job reads
  # this copy; Open WebUI receives the same pair from its runtime Secret.
  - open-webui-langfuse-project
  # The kagent project's keys, with no runtime mirror: kagent exports nothing
  # itself, and the Alloy DaemonSet that exports for it mounts this Secret as
  # it stands. Declared here because Langfuse syncs two waves ahead of Alloy.
  - kagent-langfuse-project

routes:
  - name: langfuse
    host: langfuse.test
    service: langfuse-web
    port: 3000
