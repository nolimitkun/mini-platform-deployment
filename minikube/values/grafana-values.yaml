admin:
  existingSecret: grafana-admin
  userKey: admin-user
  passwordKey: admin-password

# Keycloak SSO. The local admin above stays enabled as break-glass, so
# `disable_login_form` is deliberately left off.
grafana.ini:
  server:
    # Grafana builds the OAuth redirect_uri from root_url, and Keycloak refuses
    # anything that is not an exact match for the registered callback.
    root_url: http://grafana.test
  auth.generic_oauth:
    enabled: true
    name: Keycloak
    # New Keycloak identities become Grafana users on first login; without this
    # every SSO login fails until someone pre-creates the account by hand.
    allow_sign_up: true
    client_id: grafana
    scopes: openid profile email groups
    auth_url: http://keycloak.test/realms/mini-platform/protocol/openid-connect/auth
    token_url: http://keycloak.test/realms/mini-platform/protocol/openid-connect/token
    api_url: http://keycloak.test/realms/mini-platform/protocol/openid-connect/userinfo
    # JMESPath over the `groups` claim the realm's groups client scope adds.
    role_attribute_path: contains(groups[*], 'platform-admins') && 'Admin' || 'Viewer'
    use_pkce: true
    use_refresh_token: true

# Kept out of grafana.ini so the client secret never reaches a ConfigMap: the
# chart renders grafana.ini verbatim, while env vars can carry a secret ref.
# Grafana reads GF_<SECTION>_<KEY> over the file.
envValueFrom:
  GF_AUTH_GENERIC_OAUTH_CLIENT_SECRET:
    secretKeyRef:
      name: keycloak-sso
      key: GRAFANA_CLIENT_SECRET

persistence:
  enabled: true

initChownData:
  enabled: false

datasources:
  datasources.yaml:
    apiVersion: 1
    # Remove any pre-existing (auto-uid) Prometheus datasource first so the
    # fixed uid below can be (re)applied cleanly. Without this, changing the
    # uid of an already-persisted datasource crashes Grafana provisioning with
    # "data source not found" (persistence.enabled keeps the old row around).
    deleteDatasources:
      - name: Prometheus
        orgId: 1
    datasources:
      - name: Prometheus
        type: prometheus
        uid: prometheus
        access: proxy
        url: http://prometheus-server
        isDefault: true
      - name: Loki
        type: loki
        uid: loki
        access: proxy
        url: http://loki:3100
        jsonData:
          # Pull a trace id out of a log line and offer a jump into Tempo.
          # Covers both `trace_id=<hex>` (logfmt) and `"trace_id":"<hex>"`
          # (JSON), which is what the OTel SDKs in this stack emit.
          derivedFields:
            - name: TraceID
              matcherType: regex
              matcherRegex: '[tT]race[_-]?[iI][dD]"?[:=]\s*"?([a-f0-9]{32})'
              url: '${__value.raw}'
              urlDisplayLabel: View trace
              datasourceUid: tempo
      - name: Tempo
        type: tempo
        uid: tempo
        access: proxy
        url: http://tempo:3200
        jsonData:
          # Trace -> logs: narrow the Loki query to the same workload and time
          # window as the span, then filter to the span's trace id.
          tracesToLogsV2:
            datasourceUid: loki
            spanStartTimeShift: -5m
            spanEndTimeShift: 5m
            filterByTraceID: true
            filterBySpanID: false
            # `app` is the Loki label Alloy derives from
            # app.kubernetes.io/instance, which matches the OTel service name
            # for workloads in this stack.
            tags:
              - key: service.name
                value: app
          tracesToMetrics:
            datasourceUid: prometheus
            spanStartTimeShift: -5m
            spanEndTimeShift: 5m
          # Backed by the RED metrics Tempo's metrics generator remote-writes
          # into Prometheus (see tempo-values.yaml).
          serviceMap:
            datasourceUid: prometheus
          nodeGraph:
            enabled: true
          # Off deliberately. Streaming search makes Grafana open a gRPC stream
          # against Tempo's HTTP port, which Tempo only accepts when
          # `stream_over_http_enabled` is set -- a top-level config key the chart
          # renders no slot for, reachable only by replacing its whole `config`
          # template. Enabled against a Tempo that has it off, Grafana logs
          # "frame too large ... looked like an HTTP/1.1 header" instead of
          # returning results. Non-streaming search returns the same data, just
          # in one response rather than incrementally.
          streamingEnabled:
            search: false

dashboardProviders:
  dashboardproviders.yaml:
    apiVersion: 1
    providers:
      - name: platform
        orgId: 1
        folder: Platform
        type: file
        disableDeletion: false
        editable: true
        options:
          path: /var/lib/grafana/dashboards/platform

dashboards:
  platform:
    platform-services-overview:
      file: dashboards/platform-services-overview.json
    platform-service-detail:
      file: dashboards/platform-service-detail.json
    # GPU telemetry from dcgm-exporter.
    #
    # Inline `json:` rather than `file:` like the two above, and the difference
    # is deliberate. `file:` resolves against the *chart* directory, so those two
    # dashboards only work because they were committed inside the vendored
    # grafana chart — which the charts repo explicitly asks us not to do, and
    # which means the next `helm pull` of that chart silently deletes them
    # (replace-chart-subtree is a verbatim replacement). The chart's dashboard
    # ConfigMap template accepts an inline `json` key for exactly this case, so
    # this dashboard lives here in the overlay, where every other customization
    # lives, and survives a chart bump.
    #
    # It is verbose, and that is the cost of keeping it out of the vendored
    # tree. If more dashboards land here, the tidier route is Grafana's dashboard
    # sidecar reading labelled ConfigMaps rendered by the app-resources chart.
