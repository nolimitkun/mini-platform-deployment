admin:
  existingSecret: grafana-admin
  userKey: admin-user
  passwordKey: admin-password

# Keycloak SSO. The local admin above stays enabled as break-glass, so
# `disable_login_form` is deliberately left off.
grafana.ini:
  server:
    # Grafana builds the OAuth redirect_uri from root_url, and Keycloak refuses
    # anything that is not an exact match for the registered callback.
    root_url: http://grafana.test
  auth.generic_oauth:
    enabled: true
    name: Keycloak
    # New Keycloak identities become Grafana users on first login; without this
    # every SSO login fails until someone pre-creates the account by hand.
    allow_sign_up: true
    client_id: grafana
    scopes: openid profile email groups
    auth_url: http://keycloak.test/realms/mini-platform/protocol/openid-connect/auth
    token_url: http://keycloak.test/realms/mini-platform/protocol/openid-connect/token
    api_url: http://keycloak.test/realms/mini-platform/protocol/openid-connect/userinfo
    # JMESPath over the `groups` claim the realm's groups client scope adds.
    role_attribute_path: contains(groups[*], 'platform-admins') && 'Admin' || 'Viewer'
    use_pkce: true
    use_refresh_token: true

# Kept out of grafana.ini so the client secret never reaches a ConfigMap: the
# chart renders grafana.ini verbatim, while env vars can carry a secret ref.
# Grafana reads GF_<SECTION>_<KEY> over the file.
envValueFrom:
  GF_AUTH_GENERIC_OAUTH_CLIENT_SECRET:
    secretKeyRef:
      name: keycloak-sso
      key: GRAFANA_CLIENT_SECRET

persistence:
  enabled: true

initChownData:
  enabled: false

datasources:
  datasources.yaml:
    apiVersion: 1
    # Remove any pre-existing (auto-uid) Prometheus datasource first so the
    # fixed uid below can be (re)applied cleanly. Without this, changing the
    # uid of an already-persisted datasource crashes Grafana provisioning with
    # "data source not found" (persistence.enabled keeps the old row around).
    deleteDatasources:
      - name: Prometheus
        orgId: 1
    datasources:
      - name: Prometheus
        type: prometheus
        uid: prometheus
        access: proxy
        url: http://prometheus-server
        isDefault: true
      - name: Loki
        type: loki
        uid: loki
        access: proxy
        url: http://loki:3100
        jsonData:
          # Pull a trace id out of a log line and offer a jump into Tempo.
          # Covers both `trace_id=<hex>` (logfmt) and `"trace_id":"<hex>"`
          # (JSON), which is what the OTel SDKs in this stack emit.
          derivedFields:
            - name: TraceID
              matcherType: regex
              matcherRegex: '[tT]race[_-]?[iI][dD]"?[:=]\s*"?([a-f0-9]{32})'
              url: '${__value.raw}'
              urlDisplayLabel: View trace
              datasourceUid: tempo
      - name: Tempo
        type: tempo
        uid: tempo
        access: proxy
        url: http://tempo:3200
        jsonData:
          # Trace -> logs: narrow the Loki query to the same workload and time
          # window as the span, then filter to the span's trace id.
          tracesToLogsV2:
            datasourceUid: loki
            spanStartTimeShift: -5m
            spanEndTimeShift: 5m
            filterByTraceID: true
            filterBySpanID: false
            # `app` is the Loki label Alloy derives from
            # app.kubernetes.io/instance, which matches the OTel service name
            # for workloads in this stack.
            tags:
              - key: service.name
                value: app
          tracesToMetrics:
            datasourceUid: prometheus
            spanStartTimeShift: -5m
            spanEndTimeShift: 5m
          # Backed by the RED metrics Tempo's metrics generator remote-writes
          # into Prometheus (see tempo-values.yaml).
          serviceMap:
            datasourceUid: prometheus
          nodeGraph:
            enabled: true
          # Off deliberately. Streaming search makes Grafana open a gRPC stream
          # against Tempo's HTTP port, which Tempo only accepts when
          # `stream_over_http_enabled` is set -- a top-level config key the chart
          # renders no slot for, reachable only by replacing its whole `config`
          # template. Enabled against a Tempo that has it off, Grafana logs
          # "frame too large ... looked like an HTTP/1.1 header" instead of
          # returning results. Non-streaming search returns the same data, just
          # in one response rather than incrementally.
          streamingEnabled:
            search: false

# ==============================================================================
# DASHBOARDS
# ==============================================================================
# Dashboards arrive as labelled ConfigMaps collected by the sidecar, rather than
# through this chart's own `dashboards` value. The reason is that value's file
# lookup: `file:` resolves against the *chart* directory, so a first-party
# dashboard declared that way has to be committed inside the vendored grafana
# chart — and the charts repo replaces chart subtrees verbatim on an upstream
# bump, which deletes them without warning. That is how four dashboards came to
# live in there, two of them wired to nothing at all.
#
# The JSON now sits in minikube/gitops/app-resources/dashboards/ and is listed
# in grafana-resources.yaml, so each dashboard rolls and prunes with the Grafana
# release, survives a chart bump, and stays a diffable .json file instead of an
# indented YAML blob in this overlay.
#
# Enabling any sidecar also makes this chart grant Grafana's ServiceAccount read
# on ConfigMaps *and Secrets*, and by default it does that with a ClusterRole —
# so a dashboard collector would end up able to read every Secret in the
# cluster. `namespaced` swaps it for a Role in Grafana's own namespace, which is
# the only place this sidecar looks (searchNamespace below is null). Same
# instinct as the namespace-scoped Role HolmesGPT gets for Helm release state:
# scope it to where it is used instead of reaching for a ClusterRole.
rbac:
  namespaced: true

sidecar:
  dashboards:
    enabled: true
    label: grafana_dashboard
    # The chart matches any value by default; pinning it stops the sidecar
    # adopting a stray ConfigMap that merely carries the bare label.
    labelValue: "1"
    # ConfigMaps only. The default (`both`) also watches Secrets, which nothing
    # here uses and which widens the sidecar's RBAC for no reason.
    resource: configmap
    # null means Grafana's own namespace, which is where app-resources renders
    # them.
    searchNamespace: null
    provider:
      name: platform
      # The folder the file-based provider used, so existing dashboard URLs and
      # bookmarks keep resolving.
      folder: Platform
      disableDelete: false
      # Matches the `editable: true` the previous provider carried. The
      # ConfigMap stays the source of truth; UI edits last until the next
      # sidecar sync.
      allowUiUpdates: true
