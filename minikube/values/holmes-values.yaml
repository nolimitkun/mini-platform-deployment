# HolmesGPT — an LLM agent that root-causes cluster problems. It reads
# Kubernetes over a read-only ClusterRole and correlates that against the
# platform's own telemetry: Prometheus for metrics, Loki for logs, Tempo for
# traces. Where kagent is a chat UI you drive, Holmes is an HTTP API you ask a
# question and get an investigation back from.
#
# The release name must stay `holmes`: the chart names its Deployment and
# Service `<release>-holmes`, and the ingress route in
# minikube/values/holmes-resources.yaml points at `holmes-holmes`.

# Marks the project-key cutover and forces existing Holmes pods to reload the
# Vault-synced OTLP header during upgrades from the shared LiteLLM project.
podAnnotations:
  mini-platform.dev/langfuse-project: holmes

# Holmes wraps every shell tool in a virtual-memory limit. The x86 default of
# 800 MB is too small for this image's Go-based kubectl binary to initialize,
# even for tiny requests such as `kubectl cluster-info`. 1500 MB is verified in
# the running container and remains comfortably below the pod ceiling.
resources:
  requests:
    cpu: 100m
    memory: 2Gi
  limits:
    memory: 3Gi

# ==============================================================================
# MODEL — DeepSeek, reached through the platform's LiteLLM gateway
# ==============================================================================
# Same arrangement as kagent: Holmes speaks the OpenAI protocol to LiteLLM
# rather than to api.deepseek.com, so the DeepSeek key stays in one place
# (litellm-values.yaml, from Vault). Holmes exports the complete investigation
# trace directly to Langfuse below; the gateway is only the model endpoint for
# this client.
#
# The chart rewrites `envRef:NAME` into the runtime `{{ env.NAME }}` templating
# the model list file uses, so the key itself never appears here — it arrives as
# an env var from the Secret mounted below.
modelList:
  # The key is the name a caller passes as `model` in the HTTP API. It is also
  # the only entry, which makes it the default when a request omits `model`.
  # Must match a model_name in litellm-values.yaml's model_list.
  deepseek-v4-pro:
    model: openai/deepseek-v4-pro
    api_base: http://litellm.mini-platform.svc.cluster.local:4000/v1
    # LITELLM_API_KEY, not OPENAI_API_KEY. Holmes carries a compatibility path
    # that registers an extra model against api.openai.com whenever it finds
    # OPENAI_API_KEY in the environment, and that model wins the default —
    # every request omitting `model` would go to OpenAI with the gateway's key
    # and 401. Naming the key anything else keeps this the only model loaded.
    api_key: envRef:LITELLM_API_KEY
    # The platform gateway has global Langfuse callbacks for its other clients.
    # Holmes emits a richer, investigation-level trace directly, so tell the
    # proxy not to log these individual model calls a second time.
    extra_body:
      no-log: true

# Loaded onto the pod with envFrom, so each Secret's keys are consumed verbatim
# as env vars. All four are Vault-managed; see holmes-resources.yaml.
#   holmes-litellm  LITELLM_API_KEY               — the model list entry above
#   holmes-grafana  GRAFANA_USERNAME/PASSWORD     — the Loki and Tempo toolsets
#   holmes-api      HOLMES_API_KEY,
#                   HOLMES_APPROVAL_SIGNING_KEY   — the server's own auth
#   holmes-langfuse OTEL_EXPORTER_OTLP_TRACES_HEADERS — direct trace auth
extraEnvVarsSecrets:
  - holmes-litellm
  - holmes-grafana
  - holmes-api
  - holmes-langfuse

# ==============================================================================
# TOOLSETS — what Holmes is allowed to look at
# ==============================================================================
toolsets:
  # Live cluster reads through the pod's ServiceAccount. The ClusterRole the
  # chart renders is get/list/watch only and does not cover Secrets, so this is
  # the boundary on everything below, including `bash`.
  kubernetes/core:
    enabled: true
  # Pod logs straight from the API server. Kept alongside the Loki toolset
  # rather than replaced by it — Holmes picks whichever source fits, and this
  # one still answers for a pod whose logs have not been shipped yet.
  kubernetes/logs:
    enabled: true

  prometheus/metrics:
    enabled: true
    subtype: prometheus
    config:
      # Port 80 is what the prometheus chart's server Service publishes here,
      # not the 9090 the upstream docs assume.
      prometheus_url: http://prometheus-server.mini-platform.svc.cluster.local

  # Loki and Tempo are both reached through Grafana's datasource proxy rather
  # than directly on :3100 and :3200. Direct would need no credentials at all,
  # but going through Grafana is what makes Holmes emit clickable
  # "view in Grafana" links, and it means the datasource definitions in
  # grafana-values.yaml stay the single description of where each backend
  # lives. The uids are the fixed ones set there precisely so they can be
  # referenced by name.
  grafana/loki:
    enabled: true
    config:
      api_url: http://grafana.mini-platform.svc.cluster.local:80
      # Grafana has no GitOps-reproducible way to mint a service-account token,
      # so this uses basic auth with the admin credentials, the same compromise
      # grafana-mcp makes in kagent-values.yaml. `{{ env.NAME }}` is Holmes'
      # own templating, resolved when the toolset loads — the values land in
      # the pod from holmes-grafana, never in this file or the rendered
      # ConfigMap.
      username: "{{ env.GRAFANA_USERNAME }}"
      password: "{{ env.GRAFANA_PASSWORD }}"
      grafana_datasource_uid: loki
      # The URL a human can actually open. api_url above is cluster-internal,
      # and a link to it would be dead in a browser.
      external_url: http://grafana.test
  grafana/tempo:
    enabled: true
    config:
      api_url: http://grafana.mini-platform.svc.cluster.local:80
      username: "{{ env.GRAFANA_USERNAME }}"
      password: "{{ env.GRAFANA_PASSWORD }}"
      grafana_datasource_uid: tempo
      external_url: http://grafana.test

  # Shell access, bounded by the read-only ClusterRole above. `extended` is the
  # chart default and the level upstream recommends for containers: it adds
  # cat/ls/find on top of kubectl get/describe/logs, which Holmes needs because
  # its image has no interactive shell to fall back on.
  bash:
    enabled: true
    config:
      builtin_allowlist: extended
  connectivity_check:
    enabled: true
  skills:
    enabled: true

  # Fetches pages Holmes is pointed at, for following a runbook link out of an
  # alert annotation. Harmless but it is the one toolset that leaves the
  # cluster, so it is called out rather than left to the default.
  internet:
    enabled: true

  # Historical alerts, change tracking and resource recommendations from the
  # hosted Robusta platform. Enabled in the chart's defaults, but there is no
  # Robusta account behind this cluster, so it would only fail its health check.
  robusta:
    enabled: false

# ==============================================================================
# SERVER AUTHENTICATION
# ==============================================================================
# Holmes ships no login screen and no UI — every route is API. HOLMES_API_KEY
# makes it authenticate its own requests (X-API-Key or a bearer token), which
# is why holmes.test is *not* behind oauth2-proxy: a client sending its own
# credential cannot follow an interactive SSO redirect, the same reason
# LiteLLM's /v1 and MLflow's /api are exempt. /healthz and /readyz stay open so
# the kubelet probes still work.
#
# The key arrives as an env var from holmes-api above, alongside
# HOLMES_APPROVAL_SIGNING_KEY — without which Holmes mints an ephemeral HMAC
# key per process and in-flight tool approvals break on every restart.

# ==============================================================================
# TELEMETRY AND IDENTITY
# ==============================================================================
# The generic OTLP/HTTP endpoint activates Holmes instrumentation and keeps its
# metrics flowing through Alloy to Prometheus. The signal-specific traces
# endpoint overrides that path: investigation spans go straight from Holmes to
# Langfuse, authenticated by OTEL_EXPORTER_OTLP_TRACES_HEADERS from the
# holmes-langfuse Secret. LiteLLM is not involved in trace delivery.
#
# Both signals are emitted per investigation rather than exposed for scraping,
# so an idle Holmes publishes no series and no spans at all. That is not a gap:
# `{job="holmes"}` in Prometheus and traces in Langfuse only appear once someone
# has asked it something. Its own /metrics sits behind HOLMES_API_KEY, which is
# why prometheus-values.yaml carries no holmes job.
additionalEnvVars:
  - name: TOOL_MEMORY_LIMIT_MB
    value: "1500"
  - name: CLUSTER_NAME
    # Required, despite this cluster having no Robusta account to sync to.
    # holmes_sync_toolsets_status() raises outright when it cannot resolve a
    # cluster name, and server.py's refresh loop calls it on every toolset
    # health flip *without* the `if dal.enabled` guard it puts on the
    # neighbouring refresh_holmes_status() call. So the disconnected-platform
    # short circuit — the "Skipping holmes status and toolsets
    # synchronization" line at startup — does not cover this path: it only
    # skips the startup sync, and the per-change one runs regardless.
    #
    # Without this, every flip logged a traceback instead: 26 of them in one
    # pod's 4d22h, driven by the transient Grafana 502s that flap
    # grafana/tempo. The chart exposes no value for it, so it goes here.
    # `mini-platform` is the Minikube profile, the kube context and the node
    # name.
    value: mini-platform
  - name: OTEL_EXPORTER_OTLP_ENDPOINT
    # Generic endpoint is retained for metrics; the traces endpoint below wins
    # for spans. HTTP/protobuf is shared by Alloy and Langfuse.
    value: http://alloy.mini-platform.svc.cluster.local:4318
  - name: OTEL_EXPORTER_OTLP_PROTOCOL
    value: http/protobuf
  - name: OTEL_EXPORTER_OTLP_TRACES_ENDPOINT
    # Signal-specific endpoints include /v1/traces; the OTel SDK does not append
    # it as it does for the generic endpoint.
    value: http://langfuse-web.mini-platform.svc.cluster.local:3000/api/public/otel/v1/traces
  - name: HOLMES_LANGFUSE_ATTRIBUTES
    # Adds Langfuse's trace input/output, observation content, user/session,
    # tags, and investigation metadata attributes to Holmes' native spans.
    value: "true"
  - name: OTEL_SERVICE_NAME
    # Stable service identity on Holmes' native Langfuse spans and OTLP metrics.
    value: holmes

# ==============================================================================
# WRITABLE STATE
# ==============================================================================
# The chart hardcodes readOnlyRootFilesystem and documents it as "required for
# Holmes operation", but Holmes still writes two things under $HOME: a cache of
# toolset health status, and a config-hash file it uses to decide whether the
# toolset config changed. Both land in /root/.holmes, and without somewhere
# writable there each container start logs a WARNING for the hashes and then an
# OSError traceback from os.makedirs. Neither is fatal — the toolsets all load
# and the refresh loop carries on — but it is startup noise that reads like a
# real failure.
#
# emptyDir rather than a PVC on purpose: this is a cache. Losing it on restart
# costs one refresh cycle, and the status it holds is only meaningful for the
# lifetime of the process anyway.
additionalVolumes:
  - name: holmes-state
    emptyDir: {}
additionalVolumeMounts:
  - name: holmes-state
    mountPath: /root/.holmes

# Usage reporting to Robusta's servers. The chart turns this on whenever
# ROBUSTA_UI_DOMAIN is unset, which on a standalone install is always.
enableTelemetry: false

# The optional operator, which reconciles ScheduledHealthCheck CRs into
# recurring investigations. Left off: it is a second Deployment whose only
# purpose is running Holmes on a timer, and nothing here schedules one.
operator:
  enabled: false
