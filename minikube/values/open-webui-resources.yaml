# Open WebUI does OIDC against Keycloak itself and reaches models through
# agentgateway with its own API key. Its Vault mirrors: that key, and the
# Langfuse project credentials used by the server-side OTel exporter.
vaultSecrets:
  - open-webui-agentgateway
  - open-webui-langfuse

routes:
  - name: open-webui
    host: open-webui.test
    service: open-webui
    port: 80
