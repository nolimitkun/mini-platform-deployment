nameOverride: litellm

image:
  tag: main-latest

masterkeySecretName: litellm-master-key
masterkeySecretKey: PROXY_MASTER_KEY

# Langfuse headless initialization and LiteLLM use the same Vault-managed project keys.
environmentSecrets:
  - litellm-langfuse
  - litellm-redis
  # DEEPSEEK_API_KEY, for the hosted model below.
  - litellm-deepseek

proxy_config:
  # LiteLLM's agent gateway speaks A2A. Holmes exposes its own /api/chat
  # contract, so this card points at the first-party holmes-a2a adapter, which
  # translates message/send requests and authenticates to Holmes internally.
  agent_list:
    - agent_name: holmesgpt
      agent_card_params:
        protocolVersion: "0.3.0"
        name: HolmesGPT
        description: Investigates Kubernetes incidents using cluster state, metrics, logs, and traces.
        url: http://holmes-a2a.mini-platform.svc.cluster.local:8080
        version: "1.0.0"
        preferredTransport: JSONRPC
        capabilities:
          streaming: false
        defaultInputModes:
          - text/plain
        defaultOutputModes:
          - text/plain
        skills:
          - id: investigate-kubernetes
            name: Investigate Kubernetes incidents
            description: Find root causes using the Kubernetes API, Prometheus, Loki, and Tempo.
            tags:
              - kubernetes
              - sre
              - observability
              - root-cause-analysis
  model_list:
    - model_name: qwen3.6-27b
      litellm_params:
        model: openai/qwen3.6-27b
        api_base: http://vllm-router-service.mini-platform.svc.cluster.local/v1
        api_key: none
    # Hosted model, added for kagent: its agents lean hard on multi-step tool
    # calling, which the single-GPU local Qwen is not sized for. Routing it
    # through the gateway rather than letting kagent call api.deepseek.com
    # directly keeps the key in one place and puts agent turns in Langfuse
    # next to the rest of the platform's LLM traffic.
    #
    # Named explicitly rather than through the legacy `deepseek-chat` alias.
    # That alias still answers, but api.deepseek.com now resolves it to
    # deepseek-v4-flash — so every agent on this platform was quietly running
    # the small model while the config said otherwise. v4-pro is the reasoning
    # variant: responses carry `reasoning_content` alongside `content`, and
    # first-token latency is correspondingly higher. `deepseek-v4-flash` is the
    # cheaper sibling if an agent turns out not to need the reasoning.
    - model_name: deepseek-v4-pro
      litellm_params:
        model: deepseek/deepseek-v4-pro
        api_key: os.environ/DEEPSEEK_API_KEY
  general_settings:
    master_key: os.environ/PROXY_MASTER_KEY
    store_model_in_db: true
    store_prompts_in_spend_logs: true
  litellm_settings:
    cache: true
    callbacks:
      - prometheus
      # Emits OpenTelemetry spans for every request; the exporter target comes
      # from the OTEL_* env vars below. Langfuse stays as the LLM-specific
      # view — Tempo adds the request-path view next to it.
      - otel
    success_callback:
      - langfuse
    failure_callback:
      - langfuse

envVars:
  OTEL_EXPORTER: otlp_http
  # Through the Alloy gateway rather than Tempo directly, so every OTLP producer
  # on the platform shares one endpoint and only alloy-values.yaml decides where
  # each signal lands.
  OTEL_ENDPOINT: http://alloy.mini-platform.svc.cluster.local:4318/v1/traces
  # Becomes the Tempo service name, and matches the `app` label Alloy derives
  # from app.kubernetes.io/instance, so Grafana's trace-to-logs jump lands on
  # LiteLLM's own log stream.
  OTEL_SERVICE_NAME: litellm

db:
  useExisting: true
  endpoint: postgresql.mini-platform.svc.cluster.local
  database: litellm
  secret:
    name: litellm-dbcredentials
    usernameKey: username
    passwordKey: password
  deployStandalone: false

redis:
  enabled: false
  deployStandalone: false

migrationJob:
  enabled: true
  # Retry the PreSync schema migration long enough to outlast a database or
  # credential dependency that is still coming up, instead of giving up after
  # the chart default of 4 attempts and leaving an empty schema.
  backoffLimit: 20
