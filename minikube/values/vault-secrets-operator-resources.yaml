# The ServiceAccount that VSO's cluster-wide default auth method authenticates
# to Vault as. The operator chart renders the VaultAuth named `default` (see
# defaultAuthMethod in vault-secrets-operator-values.yaml) but not the account
# it names, so it belongs to this release rather than to any one consumer —
# every in-namespace VaultStaticSecret on the platform resolves through it.
#
# Vault's Kubernetes auth role must bind this account; see
# bound_service_account_names in scripts/deploy-minikube.sh.
vaultAuthServiceAccount: true
