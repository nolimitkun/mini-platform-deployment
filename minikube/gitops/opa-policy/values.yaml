# Both bundles are built, signed and published by the project registry's
# publisher (project-registry chart): the Rego in policies/gateway of
# nolimitkun/gateway-policy, once its change is approved, and the project data.
bundles:
  policy: gateway-policy
  projects: gateway-projects

# Signing: an RSA key in Vault Transit that never leaves Vault. The builders may
# only sign with it (Vault role bundle-signer); OPA verifies with its public key,
# from Vault through VSO (opa-policy-resources.yaml).
signing:
  vaultAddr: http://vault.mini-platform.svc.cluster.local:8200
  vaultRole: bundle-signer
  transitKey: opa-bundles
  # The key id OPA verifies with; the public key comes from publicKeySecret.
  # Both change together with the project registry's key id and key version,
  # in one commit (nolimitkun/project-registry docs/design.md "Rotating the signing key").
  keyid: opa-bundles-v2
  publicKeySecret: opa-bundle-signing
  # The field of that secret holding this version's public key: public_key for
  # version 1, public_key_v<N> after a rotation, written next to the old one so
  # an OPA pod that restarts mid-rotation still finds the key it is configured for.
  publicKeyField: public_key_v2

minio:
  url: http://minio.mini-platform.svc.cluster.local:9000
  bucket: opa-bundles
  # MinIO ignores the region, but the AWS signers need one.
  region: us-east-1
  readerSecret: opa-bundles-reader

# OPA with the Envoy ext_authz gRPC plugin: agentgateway's extAuth backend.
opa:
  image: openpolicyagent/opa:1.22.2-envoy-static
  replicas: 1
  grpcPort: 9191
  # The rule agentgateway's verdict comes from (policies/gateway/authz.rego).
  decision: gateway/authz/decision
  # Where OPA reports the bundle revisions it has loaded: the registry marks a
  # change active once every ready OPA pod has its revision.
  statusUrl: http://project-registry.mini-platform.svc.cluster.local:8080/opa
