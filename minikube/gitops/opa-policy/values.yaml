# OPA Control Plane: builds the Rego in policies/<bundle> of this repo into a
# bundle and uploads it to MinIO whenever the branch moves (it polls Git about
# every 30-60 s). Policy changes therefore go live on merge, without an Argo CD
# sync. Its state is rebuilt from this config on every start, so its SQLite
# database lives on an emptyDir.
ocp:
  image: openpolicyagent/opa-control-plane:v0.10.0
  # Public repo, no credentials. A branch name here, not a commit, so OCP
  # follows it.
  repo: https://github.com/nolimitkun/mini-platform-deployment.git
  reference: refs/heads/feat/tool-risk  # TEMP for the pre-merge rollout
  bundles:
    # bundle name -> directory under policies/. Each directory's .manifest
    # sets the bundle's roots; they must not overlap (validate-gitops.sh).
    # The Rego and the data that changes with it (catalog, data classes).
    # Not called "gateway": that was the single bundle holding project data
    # too, and an OPA still on the old config must not pick up a gateway
    # bundle without it during a rollout.
    gateway-policy: policies/gateway
    # Per-project data (scripts/gen-projects.py), one file per project: a
    # project change rebuilds only this bundle.
    gateway-projects: policies/gateway-projects

minio:
  url: http://minio.mini-platform.svc.cluster.local:9000
  bucket: opa-bundles
  # MinIO ignores the region, but the AWS signers need one.
  region: us-east-1
  writerSecret: opa-bundles-writer
  readerSecret: opa-bundles-reader

# OPA with the Envoy ext_authz gRPC plugin: agentgateway's extAuth backend.
opa:
  image: openpolicyagent/opa:1.22.2-envoy-static
  replicas: 1
  grpcPort: 9191
  # The rule agentgateway's verdict comes from (policies/gateway/authz.rego).
  decision: gateway/authz/decision
  # The bundles OPA loads together (ocp.bundles above).
  bundles:
    - gateway-policy
    - gateway-projects
