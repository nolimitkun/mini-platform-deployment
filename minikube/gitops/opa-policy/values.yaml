# The policy bundle's build, the platform's stand-in for CI (the cluster's Vault
# and MinIO are out of GitHub Actions' reach). Every minute it resolves the
# branch; on a new commit it runs opa test over policies/gateway and
# policies/gateway-projects, builds policies/gateway with the commit as its
# revision, signs it through Vault Transit and activates it in MinIO. A failing
# test publishes nothing, and OPA keeps the active bundle.
# (nolimitkun/project-registry, registry/policybuild.py)
policyBuild:
  image: ghcr.io/nolimitkun/project-registry:sha-73a9b197a68838ae869c72526aed515a9a5ff372
  schedule: "* * * * *"
  # Public repo, no credentials. A branch name, not a commit: the build follows it.
  repo: https://github.com/nolimitkun/mini-platform-deployment.git
  ref: feat/registry-round2   # TEMPORARY, for the branch test on the cluster: back to main before merge
  dir: policies/gateway
  testDirs: policies/gateway,policies/gateway-projects
  # "" for the bundles OPA loads. A branch build sets its own prefix (e.g.
  # branches/my-change/), so trying a branch never replaces what OPA loads.
  prefix: ""

# The project data bundle (gateway-projects) is built by the project registry's
# publisher (project-registry chart), not here.
bundles:
  policy: gateway-policy
  projects: gateway-projects

# Signing: an RSA key in Vault Transit that never leaves Vault. The builders may
# only sign with it (Vault role bundle-signer); OPA verifies with its public key,
# from Vault through VSO (opa-policy-resources.yaml).
signing:
  vaultAddr: http://vault.mini-platform.svc.cluster.local:8200
  vaultRole: bundle-signer
  transitKey: opa-bundles
  # The Transit key version that signs, and the key id OPA verifies with; the
  # public key comes from publicKeySecret. All three change together, with the
  # project registry's, in one commit (docs/project-registry.md "Rotating the
  # signing key").
  keyVersion: 1
  keyid: opa-bundles
  publicKeySecret: opa-bundle-signing
  serviceAccount: policy-builder

minio:
  url: http://minio.mini-platform.svc.cluster.local:9000
  bucket: opa-bundles
  # MinIO ignores the region, but the AWS signers need one.
  region: us-east-1
  writerSecret: opa-bundles-writer
  readerSecret: opa-bundles-reader

# OPA with the Envoy ext_authz gRPC plugin: agentgateway's extAuth backend.
opa:
  image: openpolicyagent/opa:1.22.2-envoy-static
  replicas: 1
  grpcPort: 9191
  # The rule agentgateway's verdict comes from (policies/gateway/authz.rego).
  decision: gateway/authz/decision
  # Where OPA reports the bundle revisions it has loaded: the registry marks a
  # change active once every OPA has its revision.
  statusUrl: http://project-registry.mini-platform.svc.cluster.local:8080/opa
