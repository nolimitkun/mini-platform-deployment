{{- $v := .Values }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ocp
  labels: {app.kubernetes.io/name: ocp}
spec:
  replicas: 1
  selector:
    matchLabels: {app.kubernetes.io/name: ocp}
  template:
    metadata:
      labels: {app.kubernetes.io/name: ocp}
      annotations:
        checksum/config: {{ include (print $.Template.BasePath "/ocp-config.yaml") . | sha256sum | trunc 16 }}
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        fsGroup: 1000
        seccompProfile: {type: RuntimeDefault}
      containers:
        - name: ocp
          image: {{ $v.ocp.image }}
          args: ["run", "--addr=0.0.0.0:8282", "--config=/config/config.yaml", "--data-dir=/data", "--apply-migrations"]
          envFrom:
            - secretRef:
                name: {{ $v.minio.writerSecret }}
          ports:
            - {name: http, containerPort: 8282}
          readinessProbe:
            tcpSocket: {port: http}
          resources:
            requests: {cpu: 50m, memory: 128Mi}
            limits: {memory: 512Mi}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: {drop: [ALL]}
          volumeMounts:
            - {name: config, mountPath: /config, readOnly: true}
            - {name: data, mountPath: /data}
            - {name: tmp, mountPath: /tmp}
      volumes:
        - name: config
          configMap: {name: ocp-config}
        - name: data
          emptyDir: {}
        - name: tmp
          emptyDir: {}
