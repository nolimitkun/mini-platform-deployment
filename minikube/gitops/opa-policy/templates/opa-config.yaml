{{- $v := .Values }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: opa-config
data:
  config.yaml: |
    services:
      minio:
        url: {{ $v.minio.url }}/{{ $v.minio.bucket }}
        credentials:
          s3_signing:
            environment_credentials: {}
      registry:
        url: {{ $v.opa.statusUrl }}
    # The bundles' signing key (Vault Transit, policy build and project registry).
    # The public key itself is set from a file at start (opa.yaml --set-file).
    keys:
      {{ $v.signing.keyid }}:
        algorithm: RS256
    # Two bundles with disjoint roots (each one's .manifest), so each activates
    # on its own: a project change swaps only gateway-projects. OPA refuses a
    # bundle whose signature doesn't verify and keeps the last good one.
    bundles:
      {{- range list $v.bundles.policy $v.bundles.projects }}
      {{ . }}:
        service: minio
        resource: {{ . }}/bundle.tar.gz
        signing:
          keyid: {{ $v.signing.keyid }}
        # Keep serving the last good bundle across restarts and MinIO outages.
        persist: true
        polling:
          min_delay_seconds: 10
          max_delay_seconds: 30
      {{- end }}
    # The bundle revisions this OPA has loaded, for the registry: a change is
    # active once every OPA reports its revision.
    status:
      service: registry
    # Bounded cache for http.send answers: the model rankings
    # (policies/gateway/rankings.rego) are fetched from Prometheus at most
    # every couple of minutes per replica.
    caching:
      inter_query_builtin_cache:
        max_size_bytes: 10000000
    plugins:
      envoy_ext_authz_grpc:
        addr: 0.0.0.0:{{ $v.opa.grpcPort }}
        path: {{ $v.opa.decision }}
    # Every decision to stdout, so Loki has the audit trail (client, model,
    # verdict). Request bodies are dropped from the log: prompts stay out of it.
    decision_logs:
      console: true
      # policies/gateway/log_mask.rego, part of the bundle.
      mask_decision: system/log/mask
