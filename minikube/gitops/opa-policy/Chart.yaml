apiVersion: v2
name: opa-policy
description: >-
  The OPA-Envoy authorizer agentgateway asks. It loads two signed bundles from
  MinIO, both published by the project registry: the Rego from Git, once a
  policy change is approved, and the project data. OPA verifies the signature
  of every bundle it loads.
type: application
version: 0.3.0
