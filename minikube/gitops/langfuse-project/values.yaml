image:
  repository: langfuse/langfuse
  tag: 3.174.1
  pullPolicy: IfNotPresent

project:
  id: holmes
  name: HolmesGPT
  organizationId: mini-platform
  credentialsSecret: holmes-langfuse-project

database:
  host: langfuse-postgresql
  name: postgres_langfuse
  username: postgres
  credentialsSecret: langfuse-postgresql
  passwordKey: password

langfuseAppSecret:
  name: langfuse-app-secrets
  saltKey: salt

resources:
  requests:
    cpu: 25m
    memory: 64Mi
  limits:
    cpu: 250m
    memory: 256Mi
