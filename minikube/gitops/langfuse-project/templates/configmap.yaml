apiVersion: v1
kind: ConfigMap
metadata:
  name: langfuse-holmes-project
data:
  provision.js: |
    const crypto = require("crypto");

    process.env.DATABASE_URL =
      `postgresql://${encodeURIComponent(process.env.DATABASE_USERNAME)}` +
      `:${encodeURIComponent(process.env.DATABASE_PASSWORD)}` +
      `@${process.env.DATABASE_HOST}/${process.env.DATABASE_NAME}`;

    const { PrismaClient } = require("@prisma/client");
    const bcrypt = require(
      "/app/node_modules/.pnpm/bcryptjs@2.4.3/node_modules/bcryptjs",
    );

    const prisma = new PrismaClient();

    function displaySecretKey(secret) {
      return `${secret.slice(0, 6)}...${secret.slice(-4)}`;
    }

    function fastHash(secret, salt) {
      const saltHash = crypto.createHash("sha256").update(salt, "utf8").digest("hex");
      return crypto.createHash("sha256").update(secret).update(saltHash).digest("hex");
    }

    async function provision() {
      const hashedSecretKey = await bcrypt.hash(process.env.LANGFUSE_SECRET_KEY, 11);
      const fastHashedSecretKey = fastHash(process.env.LANGFUSE_SECRET_KEY, process.env.SALT);

      await prisma.$transaction([
        prisma.project.upsert({
          where: { id: process.env.LANGFUSE_PROJECT_ID },
          update: { name: process.env.LANGFUSE_PROJECT_NAME },
          create: {
            id: process.env.LANGFUSE_PROJECT_ID,
            name: process.env.LANGFUSE_PROJECT_NAME,
            orgId: process.env.LANGFUSE_ORGANIZATION_ID,
            metadata: { provisionedBy: "mini-platform-gitops" },
          },
        }),
        prisma.apiKey.upsert({
          where: { publicKey: process.env.LANGFUSE_PUBLIC_KEY },
          update: {
            projectId: process.env.LANGFUSE_PROJECT_ID,
            hashedSecretKey,
            fastHashedSecretKey,
            displaySecretKey: displaySecretKey(process.env.LANGFUSE_SECRET_KEY),
            note: "Provisioned HolmesGPT API Key",
            scope: "PROJECT",
          },
          create: {
            id: crypto.randomUUID(),
            projectId: process.env.LANGFUSE_PROJECT_ID,
            publicKey: process.env.LANGFUSE_PUBLIC_KEY,
            hashedSecretKey,
            fastHashedSecretKey,
            displaySecretKey: displaySecretKey(process.env.LANGFUSE_SECRET_KEY),
            note: "Provisioned HolmesGPT API Key",
            scope: "PROJECT",
          },
        }),
      ]);

      console.log(`Langfuse project ${process.env.LANGFUSE_PROJECT_ID} is provisioned`);
    }

    provision()
      .finally(() => prisma.$disconnect())
      .catch((error) => {
        console.error(error);
        process.exit(1);
      });
