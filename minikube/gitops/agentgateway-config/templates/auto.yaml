{{- $v := .Values }}
{{- if $v.auto.enabled }}
{{- $catalog := .Files.Get "files/catalog.json" | fromJson }}
{{- /* model "auto": the platform picks the model for the caller's project.
     Each auto model is a virtual model whose callout asks OPA's REST API
     (policies/gateway/select.rego) and routes to the model it names. OPA
     only names models the project may use; an unknown project gets no
     answer, and the gateway returns 503 (no fallback model on purpose: a
     fallback would also serve projects OPA doesn't know).
     auto-<task>, one per catalog task class, carries the class for semantic
     routing; plain auto carries none. Virtual models must be public. */}}
{{- $models := list (dict "name" "auto" "task" "") }}
{{- range $catalog.tasks }}
{{- $models = append $models (dict "name" (printf "auto-%s" .) "task" .) }}
{{- end }}
{{- range $models }}
---
apiVersion: agentgateway.dev/v1alpha1
kind: AgentgatewayModel
metadata:
  name: {{ .name }}
spec:
  parentRefs:
    - group: gateway.networking.k8s.io
      kind: Gateway
      name: {{ $v.gatewayName }}
      sectionName: http
  match:
    model: {{ .name }}
  virtualModel:
    callout:
      backendRef:
        name: {{ $v.auto.opaService }}
        port: {{ $v.auto.opaPort }}
      headers:
        ":path": '"/v1/data/gateway/select/result"'
        ":method": '"POST"'
        content-type: '"application/json"'
      {{- if .task }}
      body: '{"input": {"project": apiKey.project, "task": "{{ .task }}"}}'
      {{- else }}
      body: '{"input": {"project": apiKey.project}}'
      {{- end }}
      transformation:
        model: callout.body.result.model
      {{- with $v.auto.cacheTTL }}
      # The answer depends only on the project (and this model's task), so
      # it is cached per project. A routing change reaches clients within
      # this TTL after OPA loads it.
      cache:
        key:
          - apiKey.project
        ttl: {{ . }}
      {{- end }}
{{- end }}
{{- end }}
