{{- $v := .Values }}
{{- with $v.mcp }}
apiVersion: agentgateway.dev/v1alpha1
kind: AgentgatewayBackend
metadata:
  name: platform-mcp
spec:
  mcp:
    # One unavailable server leaves the others usable.
    failureMode: FailOpen
    prefixMode: Always
    targets:
      {{- range $name, $t := .targets }}
      - name: {{ $name }}
        # By host name rather than backendRef: agentgateway then sets Host to
        # the target (it passes the client's Host through to Service
        # backends), and mcp-grafana refuses any Host not on its
        # --allowed-hosts list.
        static:
          host: {{ $t.service }}.{{ $.Release.Namespace }}.svc.cluster.local
          port: {{ $t.port }}
          protocol: StreamableHTTP
      {{- end }}
---
# tools/list per key. OPA's allow decision for /mcp carries mcp_tools, the tools
# this key may call (project-registry policy authz.rego listed_tools), and this
# keeps only those in tools/list; a call to any other is refused here too, though
# OPA has refused it before. Names are prefixed by target, as in the catalog.
# Without mcp_tools everything passes: OPA leaves it out for a project key with
# "*" (whose list must show new tools for the policy's tools-drift.py), and OPA
# from before it had none. The list is cosmetic; OPA decides each call.
apiVersion: agentgateway.dev/v1alpha1
kind: AgentgatewayPolicy
metadata:
  name: platform-mcp-tools
spec:
  targetRefs:
    - group: agentgateway.dev
      kind: AgentgatewayBackend
      name: platform-mcp
  backend:
    mcp:
      authorization:
        action: Allow
        policy:
          matchExpressions:
            - '!has(extauthz.mcp_tools) || (mcp.tool.target + "_" + mcp.tool.name) in extauthz.mcp_tools'
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: platform-mcp
spec:
  parentRefs:
    - group: gateway.networking.k8s.io
      kind: Gateway
      name: {{ $v.gatewayName }}
      sectionName: http
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: {{ .path }}
      backendRefs:
        - group: agentgateway.dev
          kind: AgentgatewayBackend
          name: platform-mcp
          weight: 1
{{- end }}
