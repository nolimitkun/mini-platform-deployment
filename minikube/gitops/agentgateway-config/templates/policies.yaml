{{- $v := .Values }}
# Every request needs a project API key (Authorization: Bearer <key>). The
# entries carry {"project": ..., "key_id": ...} metadata, which the OPA policy
# keys on (projects/*.yaml, scripts/bootstrap-vault-secrets.sh).
apiVersion: agentgateway.dev/v1alpha1
kind: AgentgatewayPolicy
metadata:
  name: {{ $v.gatewayName }}-api-keys
spec:
  targetRefs:
    - group: gateway.networking.k8s.io
      kind: Gateway
      name: {{ $v.gatewayName }}
  traffic:
    apiKeyAuthentication:
      mode: Strict
      secretRef:
        name: {{ $v.apiKeysSecret }}
{{- if $v.extAuth.enabled }}
---
# Then OPA decides (opa-policy chart, policies/gateway in this repo). It gets
# the request with its body, plus the key's project and key id; FailClosed,
# so an unreachable OPA denies everything rather than allowing it.
apiVersion: agentgateway.dev/v1alpha1
kind: AgentgatewayPolicy
metadata:
  name: {{ $v.gatewayName }}-opa
spec:
  targetRefs:
    - group: gateway.networking.k8s.io
      kind: Gateway
      name: {{ $v.gatewayName }}
  traffic:
    extAuth:
      backendRef:
        name: {{ $v.extAuth.service }}
        port: {{ $v.extAuth.port }}
      failureMode: FailClosed
      forwardBody:
        maxSize: {{ $v.extAuth.maxBodyBytes }}
      grpc:
        # Each entry becomes one metadata_context.filter_metadata struct, so
        # the value has to be a CEL map, not a bare string. The default()s
        # cover keys written before projects, which carry only {"client": ...}
        # (that name is now the project id and the key id); drop them once
        # every key in Vault has project and key_id.
        requestMetadata:
          agentgateway: '{"project": default(apiKey.project, apiKey.client), "key_id": default(apiKey.key_id, apiKey.client)}'

{{- end }}
---
apiVersion: agentgateway.dev/v1alpha1
kind: AgentgatewayPolicy
metadata:
  name: {{ $v.gatewayName }}-tracing
spec:
  targetRefs:
    - group: gateway.networking.k8s.io
      kind: Gateway
      name: {{ $v.gatewayName }}
  frontend:
    tracing:
      backendRef:
        name: {{ $v.tracing.service }}
        port: {{ $v.tracing.port }}
      protocol: GRPC
      randomSampling: {{ $v.tracing.sampling | quote }}
