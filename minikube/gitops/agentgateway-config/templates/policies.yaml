{{- $v := .Values }}
# Every request needs a project API key (Authorization: Bearer <key>). The
# entries carry {"project": ..., "key_id": ...} metadata, which the OPA policy
# keys on (projects/*.yaml, scripts/bootstrap-vault-secrets.sh).
apiVersion: agentgateway.dev/v1alpha1
kind: AgentgatewayPolicy
metadata:
  name: {{ $v.gatewayName }}-api-keys
spec:
  targetRefs:
    - group: gateway.networking.k8s.io
      kind: Gateway
      name: {{ $v.gatewayName }}
  traffic:
    apiKeyAuthentication:
      mode: Strict
      secretRef:
        name: {{ $v.apiKeysSecret }}
{{- if $v.extAuth.enabled }}
---
# Then OPA decides (opa-policy chart, policies/gateway in this repo). It gets
# the request with its body, plus the key's project and key id; FailClosed,
# so an unreachable OPA denies everything rather than allowing it.
apiVersion: agentgateway.dev/v1alpha1
kind: AgentgatewayPolicy
metadata:
  name: {{ $v.gatewayName }}-opa
spec:
  targetRefs:
    - group: gateway.networking.k8s.io
      kind: Gateway
      name: {{ $v.gatewayName }}
  traffic:
    extAuth:
      backendRef:
        name: {{ $v.extAuth.service }}
        port: {{ $v.extAuth.port }}
      failureMode: FailClosed
      forwardBody:
        maxSize: {{ $v.extAuth.maxBodyBytes }}
      grpc:
        # Each entry becomes one metadata_context.filter_metadata struct, so
        # the value has to be a CEL map, not a bare string.
        requestMetadata:
          agentgateway: '{"project": apiKey.project, "key_id": apiKey.key_id}'
---
# /v1/models per project. OPA's decision for that path sets x-allowed-models to
# the models the project may use (policies/gateway/authz.rego), and this answers
# with exactly those. It is built from the header alone, never from the upstream
# body: a policy on the Gateway that reads response.body makes agentgateway
# buffer every response on every route, whatever its condition, which turns
# streamed completions into one block (no tokens until the last one). So the
# entries carry ids only, with owned_by "virtual" for the auto names as the
# gateway reports them. Without the header (OPA from before this change) the
# gateway's own list goes out whole: it is cosmetic, authorization still
# decides every call.
apiVersion: agentgateway.dev/v1alpha1
kind: AgentgatewayPolicy
metadata:
  name: {{ $v.gatewayName }}-models-list
spec:
  targetRefs:
    - group: gateway.networking.k8s.io
      kind: Gateway
      name: {{ $v.gatewayName }}
  traffic:
    transformation:
      conditional:
        - condition: 'request.path == "/v1/models" && "x-allowed-models" in request.headers'
          policy:
            response:
              body: 'toJson({"object": "list", "data": request.headers["x-allowed-models"].split(",").filter(m, m != "").map(m, {"id": m, "object": "model", "created": 0, "owned_by": m == "auto" || m.startsWith("auto-") ? "virtual" : "agentgateway"})})'
{{- end }}
---
apiVersion: agentgateway.dev/v1alpha1
kind: AgentgatewayPolicy
metadata:
  name: {{ $v.gatewayName }}-tracing
spec:
  targetRefs:
    - group: gateway.networking.k8s.io
      kind: Gateway
      name: {{ $v.gatewayName }}
  frontend:
    tracing:
      backendRef:
        name: {{ $v.tracing.service }}
        port: {{ $v.tracing.port }}
      protocol: GRPC
      randomSampling: {{ $v.tracing.sampling | quote }}
---
# A project label on every gateway metric (requests, tokens, cost, latency),
# from the API key's metadata, for per-project usage and cost
# (dashboard "Agentgateway projects"). Requests without a valid key get
# "unknown". Low cardinality by design: projects, not keys or users.
apiVersion: agentgateway.dev/v1alpha1
kind: AgentgatewayPolicy
metadata:
  name: {{ $v.gatewayName }}-metrics
spec:
  targetRefs:
    - group: gateway.networking.k8s.io
      kind: Gateway
      name: {{ $v.gatewayName }}
  frontend:
    metrics:
      attributes:
        add:
          - name: project
            expression: apiKey.project
