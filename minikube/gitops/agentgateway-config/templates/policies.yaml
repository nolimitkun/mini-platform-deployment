{{- $v := .Values }}
# Every request needs a project API key (Authorization: Bearer <key>). The
# entries carry {"project": ..., "key_id": ...} metadata, which the OPA policy
# keys on (the project registry issues the keys from its projects and agents).
apiVersion: agentgateway.dev/v1alpha1
kind: AgentgatewayPolicy
metadata:
  name: {{ $v.gatewayName }}-api-keys
spec:
  targetRefs:
    - group: gateway.networking.k8s.io
      kind: Gateway
      name: {{ $v.gatewayName }}
  traffic:
    apiKeyAuthentication:
      mode: Strict
      secretRef:
        name: {{ $v.apiKeysSecret }}
{{- if $v.extAuth.enabled }}
---
# Then OPA decides (opa-policy chart; policies/gateway in the registry's policy/). It gets
# the request with its body, plus the key's project and key id; FailClosed,
# so an unreachable OPA denies everything rather than allowing it.
#
# gRPC calls (content-type application/grpc: Google's streaming speech and TTS)
# go without the body. The gateway would wait for the end of the request body
# before asking, and a stream's body ends only when the client stops sending,
# so a live transcription would get its answer, or its denial, only after the
# last chunk. OPA decides those by the path (the gRPC service) and the key alone.
# Nothing is gained by sending a model or MCP call as gRPC: without a body, the
# rules that read the requested model or tool deny it.
apiVersion: agentgateway.dev/v1alpha1
kind: AgentgatewayPolicy
metadata:
  name: {{ $v.gatewayName }}-opa
spec:
  targetRefs:
    - group: gateway.networking.k8s.io
      kind: Gateway
      name: {{ $v.gatewayName }}
  traffic:
    extAuth:
      conditional:
        - condition: '"content-type" in request.headers && request.headers["content-type"].startsWith("application/grpc")'
          policy:
            {{- include "agentgateway-config.opaExtAuth" $v | nindent 12 }}
        - policy:
            {{- include "agentgateway-config.opaExtAuth" $v | nindent 12 }}
            forwardBody:
              maxSize: {{ int $v.extAuth.maxBodyBytes }}
---
# /v1/models per project. OPA's decision for that path sets x-allowed-models to
# the models the project may use (policies/gateway/authz.rego), and this answers
# with exactly those. It is built from the header alone, never from the upstream
# body: a policy on the Gateway that reads response.body makes agentgateway
# buffer every response on every route, whatever its condition, which turns
# streamed completions into one block (no tokens until the last one). So the
# entries carry ids only, with owned_by "virtual" for the auto names as the
# gateway reports them. Without the header (OPA from before this change) the
# gateway's own list goes out whole: it is cosmetic, authorization still
# decides every call.
apiVersion: agentgateway.dev/v1alpha1
kind: AgentgatewayPolicy
metadata:
  name: {{ $v.gatewayName }}-models-list
spec:
  targetRefs:
    - group: gateway.networking.k8s.io
      kind: Gateway
      name: {{ $v.gatewayName }}
  traffic:
    transformation:
      conditional:
        - condition: 'request.path == "/v1/models" && "x-allowed-models" in request.headers'
          policy:
            response:
              body: 'toJson({"object": "list", "data": request.headers["x-allowed-models"].split(",").filter(m, m != "").map(m, {"id": m, "object": "model", "created": 0, "owned_by": m == "auto" || m.startsWith("auto-") ? "virtual" : "agentgateway"})})'
{{- end }}
---
apiVersion: agentgateway.dev/v1alpha1
kind: AgentgatewayPolicy
metadata:
  name: {{ $v.gatewayName }}-tracing
spec:
  targetRefs:
    - group: gateway.networking.k8s.io
      kind: Gateway
      name: {{ $v.gatewayName }}
  frontend:
    tracing:
      backendRef:
        name: {{ $v.tracing.service }}
        port: {{ $v.tracing.port }}
      protocol: GRPC
      randomSampling: {{ $v.tracing.sampling | quote }}
---
# A project label on every gateway metric (requests, tokens, cost, latency),
# from the API key's metadata, for per-project usage and cost
# (dashboard "Agentgateway projects"). Requests without a valid key get
# "unknown". Low cardinality by design: projects, not keys or users.
apiVersion: agentgateway.dev/v1alpha1
kind: AgentgatewayPolicy
metadata:
  name: {{ $v.gatewayName }}-metrics
spec:
  targetRefs:
    - group: gateway.networking.k8s.io
      kind: Gateway
      name: {{ $v.gatewayName }}
  frontend:
    metrics:
      attributes:
        add:
          - name: project
            expression: apiKey.project
    # The same on every access log line, plus the key: the project registry's usage
    # job reads these lines from Loki into its spend and usage ledger (Parquet in
    # MinIO), per project and per key (a registered agent's key is the agent).
    # Not on the metrics: a label per key is high cardinality, a log field isn't.
    # A request without a valid key has neither (the expression fails, the pair is
    # left out).
    accessLog:
      attributes:
        add:
          - name: project
            expression: apiKey.project
          - name: key_id
            expression: apiKey.key_id
          # A call OPA refuses (ext_authz) never reaches the LLM or MCP handling, so
          # gen_ai.request.model and gen_ai.tool.name are missing from its line: take
          # them from the body (which ext_authz already buffers), on 403s only. A body
          # without the field fails the expression and leaves the pair out.
          - name: refused.model
            expression: 'response.code == 403 ? json(request.body).model : fail("")'
          - name: refused.tool
            expression: 'response.code == 403 && json(request.body).method == "tools/call" ? json(request.body).params.name : fail("")'
