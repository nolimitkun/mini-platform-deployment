{{- $v := .Values }}
{{- /* Models come from the repo's catalog/models.yaml, through files/catalog.json
     (scripts/gen-catalog.py). */}}
{{- $catalog := .Files.Get "files/catalog.json" | fromJson }}
{{- if not $catalog.models }}
{{- fail "files/catalog.json is missing or lists no models: run scripts/gen-catalog.py" }}
{{- end }}
{{- range $catalog.models }}
---
apiVersion: agentgateway.dev/v1alpha1
kind: AgentgatewayModel
metadata:
  name: {{ .name | replace "." "-" }}
spec:
  parentRefs:
    - group: gateway.networking.k8s.io
      kind: Gateway
      name: {{ $v.gatewayName }}
      sectionName: http
  match:
    model: {{ .name }}
  provider: {{ .provider }}
  {{- with .baseURL }}
  baseURL: {{ . }}
  {{- end }}
  {{- if eq .provider "VertexAI" }}
  vertexai:
    projectId: {{ $v.gcp.project }}
    region: {{ .region }}
  policies:
    auth:
      gcp:
        type: AccessToken
  {{- else if .secretRef }}
  policies:
    auth:
      secretRef:
        name: {{ .secretRef }}
  {{- end }}
{{- end }}
