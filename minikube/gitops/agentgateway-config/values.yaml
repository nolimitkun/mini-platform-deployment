# The proxy the agentgateway controller (charts/agentgateway) creates for this
# Gateway runs as a Deployment, Service and ServiceAccount all named after it.
# The ServiceAccount is the identity GCP trusts (mini-cloud
# infra/modules/gcp-stt-poc, k8s_subjects), so renaming the Gateway breaks the
# keyless login until that list is updated.
gatewayName: agentgateway-proxy

# The proxy's built-in admin UI (/ui) and config dump. It has no login of its
# own and listens only on the pod's loopback by default; this opens it on the
# pod network behind a ClusterIP Service, <gatewayName>-admin. The only route
# in from outside is agentgateway-admin.test, behind the Keycloak login and
# limited to platform-admins (minikube/values/agentgateway-resources.yaml).
# Nothing on this cluster enforces NetworkPolicy, so any pod can still reach
# the Service directly. The UI is read-only in practice: the controller owns
# the config, and edits made through it do not survive.
admin:
  port: 15000

# The admin UI's LLM > Analytics page (spend, tokens and calls per model,
# provider, user): the proxy keeps a request log in SQLite, on this volume so
# the history survives restarts. Costs come from agentgateway's built-in price
# table, the same rates as catalog/models.yaml; self-hosted models count as $0.
# One replica: each replica would keep its own log. The Prometheus metrics stay
# the source for budgets and alerts.
analytics:
  enabled: true
  storage: 2Gi

# Keyless Google login: the proxy's own service-account token, minted for the
# onprem-k8s pool's audience and rotated by the kubelet, is exchanged for a
# Google token that impersonates litellm-stt. Nothing secret in it.
gcp:
  project: mini-cloud-499820
  audience: //iam.googleapis.com/projects/311800512343/locations/global/workloadIdentityPools/onprem-k8s/providers/minikube
  serviceAccount: litellm-stt@mini-cloud-499820.iam.gserviceaccount.com

# Releases of the model onboarding pipeline (catalog provider KServe): the
# Secret, in each serving namespace, with the vLLM key the gateway sends
# (model-serving chart, servingKeySecret).
kserve:
  servingKeySecret: model-serving-key

# Models and Google API routes are not here: they come from the gateway policy's
# catalog (nolimitkun/gateway-policy, catalog/models.yaml), as the values file
# its gen-catalog.py generates (generated/agentgateway-catalog.yaml: catalog),
# which the root app adds at policyRevision. OPA reads the same catalog.
catalog: {}

# Model "auto" and "auto-<task>" (templates/auto.yaml): virtual models that ask
# OPA's REST API which model the caller's project gets (policies/gateway/select.rego).
auto:
  enabled: true
  opaService: opa
  opaPort: 8181
  # Per-project cache of OPA's answer, e.g. 1m. Off by default: a cache hit
  # skips OPA, so after a policy change removes the cached model the gateway
  # would keep routing to it until the entry expires, and ext_authz only ever
  # sees "auto", not the model behind it. Uncached, the callout adds about a
  # millisecond.
  cacheTTL: ""

# vLLM Semantic Router (semantic-router app, templates/vsr.yaml): rewrites
# "auto" to auto-<task> for projects whose routing is semantic to make use of.
semanticRouter:
  enabled: true
  service: semantic-router
  port: 50051

# Per-project rate limits and spend caps (templates/ratelimit.yaml), kept by
# the rate-limit app. domain must match minikube/gitops/rate-limit/files/config.yaml.
rateLimit:
  enabled: true
  service: rate-limit
  port: 8081
  domain: agentgateway

# Client API keys, one per client, from Vault (scripts/bootstrap-vault-secrets.sh).
apiKeysSecret: agentgateway-api-keys

# OPA, asked about every request before it is routed (opa-policy chart).
extAuth:
  enabled: true
  service: opa
  port: 9191
  # Bodies are forwarded so the policy can read the requested model. Larger
  # requests are refused outright rather than passed unchecked.
  maxBodyBytes: 4194304

# OTLP traces through the Alloy gateway, like every other producer here.
tracing:
  service: alloy
  port: 4317
  sampling: "1.0"

# MCP servers behind the gateway, merged into one MCP endpoint at /mcp: a
# client sees every target's tools, each prefixed with the target's name
# (grafana_..., kagent-tools_...), and OPA decides per client which tools it may
# call (policies/gateway). Holmes' GitHub MCP server is not here: it reads its
# GitHub token from the Authorization header, the same header the gateway's
# API key uses.
mcp:
  path: /mcp
  targets:
    grafana: {service: kagent-grafana-mcp, port: 8000}
    kagent-tools: {service: kagent-tools, port: 8084}
