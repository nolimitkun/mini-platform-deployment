apiVersion: apps/v1
kind: Deployment
metadata:
  name: holmes-a2a
  labels:
    app.kubernetes.io/name: holmes-a2a
    app.kubernetes.io/instance: holmes-a2a
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: holmes-a2a
      app.kubernetes.io/instance: holmes-a2a
  template:
    metadata:
      labels:
        app.kubernetes.io/name: holmes-a2a
        app.kubernetes.io/instance: holmes-a2a
      annotations:
        checksum/adapter: {{ include (print $.Template.BasePath "/configmap.yaml") . | sha256sum }}
    spec:
      containers:
        - name: adapter
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          command: ["python3", "-u", "/adapter/adapter.py"]
          env:
            - name: HOLMES_URL
              value: {{ .Values.holmes.url | quote }}
            - name: HOLMES_API_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.holmes.apiKeySecret.name }}
                  key: {{ .Values.holmes.apiKeySecret.key }}
          ports:
            - name: http
              containerPort: 8080
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: adapter
              mountPath: /adapter
              readOnly: true
          resources:
{{ toYaml .Values.resources | nindent 12 }}
      volumes:
        - name: adapter
          configMap:
            name: holmes-a2a
