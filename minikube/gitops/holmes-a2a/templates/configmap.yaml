apiVersion: v1
kind: ConfigMap
metadata:
  name: holmes-a2a
data:
  adapter.py: |
    import json
    import os
    import uuid
    from http.server import BaseHTTPRequestHandler, ThreadingHTTPServer
    from urllib.error import HTTPError, URLError
    from urllib.request import Request, urlopen

    HOLMES_URL = os.environ["HOLMES_URL"]
    HOLMES_API_KEY = os.environ["HOLMES_API_KEY"]
    AGENT_CARD = {
        "protocolVersion": "0.3.0",
        "name": "HolmesGPT",
        "description": "Investigates Kubernetes incidents using cluster state, metrics, logs, and traces.",
        "url": "http://holmes-a2a.mini-platform.svc.cluster.local:8080",
        "version": "1.0.0",
        "preferredTransport": "JSONRPC",
        "capabilities": {"streaming": False},
        "defaultInputModes": ["text/plain"],
        "defaultOutputModes": ["text/plain"],
        "skills": [
            {
                "id": "investigate-kubernetes",
                "name": "Investigate Kubernetes incidents",
                "description": "Find root causes using the Kubernetes API, Prometheus, Loki, and Tempo.",
                "tags": ["kubernetes", "sre", "observability", "root-cause-analysis"],
            }
        ],
    }


    def jsonrpc_error(request_id, code, message, data=None):
        error = {"code": code, "message": message}
        if data is not None:
            error["data"] = data
        return {"jsonrpc": "2.0", "id": request_id, "error": error}


    class Handler(BaseHTTPRequestHandler):
        server_version = "holmes-a2a/1.0"

        def write_json(self, status, payload):
            body = json.dumps(payload).encode()
            self.send_response(status)
            self.send_header("Content-Type", "application/json")
            self.send_header("Content-Length", str(len(body)))
            self.end_headers()
            self.wfile.write(body)

        def do_GET(self):
            if self.path in ("/healthz", "/readyz"):
                self.write_json(200, {"status": "ok"})
                return
            if self.path in ("/.well-known/agent-card.json", "/.well-known/agent.json"):
                self.write_json(200, AGENT_CARD)
                return
            self.write_json(404, {"error": "not found"})

        def do_POST(self):
            try:
                length = int(self.headers.get("Content-Length", "0"))
                payload = json.loads(self.rfile.read(length))
            except (ValueError, json.JSONDecodeError) as error:
                self.write_json(400, jsonrpc_error(None, -32700, "Parse error", str(error)))
                return

            request_id = payload.get("id")
            if payload.get("jsonrpc") != "2.0" or payload.get("method") != "message/send":
                self.write_json(400, jsonrpc_error(request_id, -32601, "Only message/send is supported"))
                return

            params = payload.get("params") or {}
            message = params.get("message") or {}
            parts = message.get("parts") or []
            question = "\n".join(
                part.get("text", "")
                for part in parts
                if part.get("kind", part.get("type")) == "text"
            ).strip()
            if not question:
                self.write_json(400, jsonrpc_error(request_id, -32602, "A text message part is required"))
                return

            context_id = message.get("contextId") or params.get("contextId") or str(uuid.uuid4())
            holmes_body = json.dumps(
                {
                    "ask": question,
                    "conversation_id": context_id,
                    "request_source": "litellm-a2a",
                }
            ).encode()
            holmes_request = Request(
                HOLMES_URL,
                data=holmes_body,
                headers={
                    "Content-Type": "application/json",
                    "X-API-Key": HOLMES_API_KEY,
                },
                method="POST",
            )
            try:
                with urlopen(holmes_request, timeout=900) as response:
                    holmes_response = json.load(response)
            except HTTPError as error:
                detail = error.read().decode(errors="replace")
                self.write_json(502, jsonrpc_error(request_id, -32001, "HolmesGPT rejected the investigation", detail))
                return
            except (URLError, TimeoutError) as error:
                self.write_json(502, jsonrpc_error(request_id, -32002, "HolmesGPT is unavailable", str(error)))
                return

            answer = holmes_response.get("analysis") or holmes_response.get("answer")
            if not answer:
                self.write_json(502, jsonrpc_error(request_id, -32003, "HolmesGPT returned no analysis"))
                return

            self.write_json(
                200,
                {
                    "jsonrpc": "2.0",
                    "id": request_id,
                    "result": {
                        "kind": "message",
                        "role": "agent",
                        "messageId": str(uuid.uuid4()),
                        "contextId": context_id,
                        "parts": [{"kind": "text", "text": answer}],
                    },
                },
            )


    ThreadingHTTPServer(("0.0.0.0", 8080), Handler).serve_forever()
