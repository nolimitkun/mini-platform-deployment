apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ .Values.vaultAuth.serviceAccount }}
  namespace: {{ .Release.Namespace }}
{{- /*
  VSO looks up a VaultStaticSecret's vaultAuthRef in the secret's own namespace,
  and the VaultAuth in turn authenticates with a ServiceAccount from that same
  namespace. A secret destined for another namespace therefore needs both
  rendered there as well; the operator's own defaultAuthMethod only covers the
  release namespace.
*/}}
{{- $namespaces := list }}
{{- range .Values.vaultSecrets.external }}
{{- $namespaces = append $namespaces .namespace }}
{{- end }}
{{- range $ns := $namespaces | uniq }}
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ $.Values.vaultAuth.serviceAccount }}
  namespace: {{ $ns }}
---
apiVersion: secrets.hashicorp.com/v1beta1
kind: VaultAuth
metadata:
  name: {{ $.Values.vaultSecrets.vaultAuthRef }}
  namespace: {{ $ns }}
  annotations:
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
spec:
  method: {{ $.Values.vaultAuth.method }}
  mount: {{ $.Values.vaultAuth.mount }}
  kubernetes:
    role: {{ $.Values.vaultAuth.role }}
    serviceAccount: {{ $.Values.vaultAuth.serviceAccount }}
    audiences:
      - {{ $.Values.vaultAuth.audience }}
{{- end }}
