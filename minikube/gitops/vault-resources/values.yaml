vaultSecrets:
  mount: mini-platform
  vaultAuthRef: default
  refreshAfter: 1m
  names:
    - postgresql-credentials
    - litellm-dbcredentials
    - redis-credentials
    - litellm-redis
    - litellm-master-key
    - langfuse-app-secrets
    - langfuse-postgresql
    - langfuse-redis
    - langfuse-clickhouse
    - langfuse-s3
    - litellm-langfuse
    - langfuse-init-user
    - vllm-hf-token
    - mlflow-auth
    - mlflow-postgresql
    - mlflow-minio
    - grafana-admin
    - superset-postgresql
    - superset-redis
    - superset-env
    - keycloak-admin
    - keycloak-postgresql
    - minio-root-credentials
    # DeepSeek key for the LiteLLM model_list entry kagent points at.
    - litellm-deepseek
    # kagent's credential for calling LiteLLM, and its Grafana basic-auth pair
    # (consumed with envFrom, hence the env-var-shaped keys).
    - kagent-litellm
    - kagent-grafana
