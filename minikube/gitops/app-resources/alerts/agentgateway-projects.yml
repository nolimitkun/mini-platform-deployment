# Edited by hand: the rules list no project; budgets come from the project
# registry's /metrics (project_budget_usd).
# Prometheus alert rules for the gateway's projects (prometheus-resources.yaml).
groups:
- name: agentgateway-projects
  rules:
  - alert: GatewayProjectBudgetForecast
    expr: 30 * sum by (project) (increase(agentgateway_gen_ai_client_cost_usd_total{gateway="mini-platform/agentgateway-proxy"}[24h])) > on (project) 0.8 * max by (project) (project_budget_usd)
    for: 30m
    labels:
      severity: warning
    annotations:
      summary: '{{ $labels.project }} is on course to use over 80% of its budget'
      description: The last 24 hours cost {{ $value | printf "%.2f" }} USD over 30 days. At the budget (project_budget_usd, from the project registry) the gateway answers 429. Raise the project's budget
        in the registry or find the caller (dashboard Agentgateway projects).
  # A key's own budget (the project's key_limits). The gateway's metrics have
  # no key label, so both sides come from the project registry's /metrics: the
  # budget, and the key's spend over the last 30 days from its usage ledger,
  # which is extracted hourly (so this lags by up to an hour). Only keys with a
  # budget of their own have either series.
  - alert: GatewayKeyBudgetHigh
    expr: max by (project, key_id) (key_spend_30d_usd) > on (project, key_id) 0.8 * max by (project, key_id) (key_budget_usd)
    for: 30m
    labels:
      severity: warning
    annotations:
      summary: 'Key {{ $labels.key_id }} of {{ $labels.project }} has used over 80% of its own budget'
      description: It spent {{ $value | printf "%.2f" }} USD in the last 30 days (usage ledger). At its budget the gateway answers 429 for this key only. Raise the key's budget in the project registry (the project's per-key limits) or find the caller.
  - alert: GatewayProjectRateLimited
    expr: sum by (project) (increase(agentgateway_requests_total{gateway="mini-platform/agentgateway-proxy",reason="RateLimit"}[10m])) > 0
    labels:
      severity: warning
    annotations:
      summary: 'The gateway refused calls from {{ $labels.project }}: request limit or budget reached'
      description: '{{ $value | printf "%.0f" }} calls got 429 in 10 minutes: the project''s limits or budget, or one of its keys'' own. Both are in the project registry; the portal''s Usage page has the 429s per key.'
  # Price drift. Budgets are charged at agentgateway's built-in price table
  # (llm.cost.total, ratelimit.yaml); auto and the portal use the catalog's
  # prices, which the project registry exports as model_price_usd_per_million_tokens,
  # labelled like the gateway's token metrics (a KServe model under its served
  # name). The two recorded series are, per model over 6 hours, what the gateway
  # charged and the same tokens at the catalog's price; a model the gateway's
  # table doesn't know is charged $0 and so differs too. A model outside the
  # catalog has no catalog cost and is left out.
  - record: model:gateway_cost_usd:increase6h
    expr: |
      sum by (gen_ai_request_model) (increase(agentgateway_gen_ai_client_cost_usd_total{gateway="mini-platform/agentgateway-proxy"}[6h]))
      or 0 * sum by (gen_ai_request_model) (increase(agentgateway_gen_ai_client_token_usage_sum{gateway="mini-platform/agentgateway-proxy"}[6h]))
  - record: model:catalog_cost_usd:increase6h
    expr: |
      sum by (gen_ai_request_model) (
        increase(agentgateway_gen_ai_client_token_usage_sum{gateway="mini-platform/agentgateway-proxy"}[6h])
        * on (gen_ai_request_model, gen_ai_token_type) group_left
        max by (gen_ai_request_model, gen_ai_token_type) (model_price_usd_per_million_tokens)
      ) / 1e6
  - alert: GatewayModelPriceDrift
    expr: abs(model:gateway_cost_usd:increase6h - on (gen_ai_request_model) model:catalog_cost_usd:increase6h) > on (gen_ai_request_model) (0.1 * model:catalog_cost_usd:increase6h + 0.0001)
    for: 30m
    labels:
      severity: warning
    annotations:
      summary: 'Budgets charge {{ $labels.gen_ai_request_model }} at a price other than the catalog''s'
      description: The gateway's cost for this model over 6 hours differs from its tokens at the catalog price by {{ $value | printf "%.4f" }} USD. Budgets use the gateway's price table and auto uses the catalog's. Correct the model's price in the project registry, or, for a model the gateway's table doesn't know (charged $0), keep its budget in mind until agentgateway knows it.
  - alert: GatewayUpstreamThrottled
    expr: sum by (backend) (increase(agentgateway_requests_total{gateway="mini-platform/agentgateway-proxy",reason="Upstream",status="429"}[15m])) >= 5
    labels:
      severity: warning
    annotations:
      summary: '{{ $labels.backend }} is throttling the gateway (429 from the provider)'
      description: '{{ $value | printf "%.0f" }} calls got 429 from the provider in 15 minutes. For Vertex models, check the project''s quota in the GCP console.'
  - alert: ProjectRegistryOutputStale
    # An output of the registry's publisher (data, policy, chart, keys, activation,
    # agentregistry; and the hourly usage job) that hasn't finished a round lately, or
    # has failed and never finished one. agentregistry and usage run hourly; the
    # others every few seconds to a minute.
    expr: |
      (time() - registry_output_last_success_timestamp_seconds{output!~"agentregistry|usage"} > 900)
      or (time() - registry_output_last_success_timestamp_seconds{output=~"agentregistry|usage"} > 7200)
      or (time() - registry_output_last_failure_timestamp_seconds
          unless on (output) registry_output_last_success_timestamp_seconds)
    for: 5m
    labels:
      severity: warning
    annotations:
      summary: 'The project registry''s {{ $labels.output }} output is not keeping up'
      description: 'No successful round for {{ $value | humanizeDuration }}. Its last error is in the publisher''s log (kubectl -n mini-platform logs deploy/project-registry-publisher) and in the registry''s publisher_health table.'
