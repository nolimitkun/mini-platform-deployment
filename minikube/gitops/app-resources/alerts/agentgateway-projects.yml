# Edited by hand: the rules list no project; budgets come from the project
# registry's /metrics (project_budget_usd).
# Prometheus alert rules for the gateway's projects (prometheus-resources.yaml).
groups:
- name: agentgateway-projects
  rules:
  - alert: GatewayProjectBudgetForecast
    expr: 30 * sum by (project) (increase(agentgateway_gen_ai_client_cost_usd_total{gateway="mini-platform/agentgateway-proxy"}[24h])) > on (project) 0.8 * max by (project) (project_budget_usd)
    for: 30m
    labels:
      severity: warning
    annotations:
      summary: '{{ $labels.project }} is on course to use over 80% of its budget'
      description: The last 24 hours cost {{ $value | printf "%.2f" }} USD over 30 days. At the budget (project_budget_usd, from the project registry) the gateway answers 429. Raise the project's budget
        in the registry or find the caller (dashboard Agentgateway projects).
  - alert: GatewayProjectRateLimited
    expr: sum by (project) (increase(agentgateway_requests_total{gateway="mini-platform/agentgateway-proxy",reason="RateLimit"}[10m])) > 0
    labels:
      severity: warning
    annotations:
      summary: 'The gateway refused calls from {{ $labels.project }}: request limit or budget reached'
      description: '{{ $value | printf "%.0f" }} calls got 429 in 10 minutes. The project''s limits and budget are in the project registry.'
  - alert: GatewayUpstreamThrottled
    expr: sum by (backend) (increase(agentgateway_requests_total{gateway="mini-platform/agentgateway-proxy",reason="Upstream",status="429"}[15m])) >= 5
    labels:
      severity: warning
    annotations:
      summary: '{{ $labels.backend }} is throttling the gateway (429 from the provider)'
      description: '{{ $value | printf "%.0f" }} calls got 429 from the provider in 15 minutes. For Vertex models, check the project''s quota in the GCP console.'
