# Generated by scripts/gen-projects.py from projects/*.yaml; do not edit.
# Prometheus alert rules for the gateway's projects (prometheus-resources.yaml).
groups:
- name: agentgateway-projects
  rules:
  - alert: GatewayProjectBudgetForecast
    expr: 30 * sum(increase(agentgateway_gen_ai_client_cost_usd_total{gateway="mini-platform/agentgateway-proxy",project="admin"}[24h])) > 0.8 * 25
    for: 30m
    labels:
      severity: warning
      project: admin
    annotations:
      summary: admin is on course to use over 80% of its 25 USD budget
      description: The last 24 hours cost {{ $value | printf "%.2f" }} USD over 30 days. At 25 USD per 30 days the gateway answers 429. Raise budget.usd_per_30_days in projects/admin.yaml or find the caller
        (dashboard Agentgateway projects).
  - alert: GatewayProjectBudgetForecast
    expr: 30 * sum(increase(agentgateway_gen_ai_client_cost_usd_total{gateway="mini-platform/agentgateway-proxy",project="holmes"}[24h])) > 0.8 * 20
    for: 30m
    labels:
      severity: warning
      project: holmes
    annotations:
      summary: holmes is on course to use over 80% of its 20 USD budget
      description: The last 24 hours cost {{ $value | printf "%.2f" }} USD over 30 days. At 20 USD per 30 days the gateway answers 429. Raise budget.usd_per_30_days in projects/holmes.yaml or find the caller
        (dashboard Agentgateway projects).
  - alert: GatewayProjectBudgetForecast
    expr: 30 * sum(increase(agentgateway_gen_ai_client_cost_usd_total{gateway="mini-platform/agentgateway-proxy",project="kagent"}[24h])) > 0.8 * 30
    for: 30m
    labels:
      severity: warning
      project: kagent
    annotations:
      summary: kagent is on course to use over 80% of its 30 USD budget
      description: The last 24 hours cost {{ $value | printf "%.2f" }} USD over 30 days. At 30 USD per 30 days the gateway answers 429. Raise budget.usd_per_30_days in projects/kagent.yaml or find the caller
        (dashboard Agentgateway projects).
  - alert: GatewayProjectBudgetForecast
    expr: 30 * sum(increase(agentgateway_gen_ai_client_cost_usd_total{gateway="mini-platform/agentgateway-proxy",project="open-webui"}[24h])) > 0.8 * 50
    for: 30m
    labels:
      severity: warning
      project: open-webui
    annotations:
      summary: open-webui is on course to use over 80% of its 50 USD budget
      description: The last 24 hours cost {{ $value | printf "%.2f" }} USD over 30 days. At 50 USD per 30 days the gateway answers 429. Raise budget.usd_per_30_days in projects/open-webui.yaml or find the
        caller (dashboard Agentgateway projects).
  - alert: GatewayProjectRateLimited
    expr: sum by (project) (increase(agentgateway_requests_total{gateway="mini-platform/agentgateway-proxy",reason="RateLimit"}[10m])) > 0
    labels:
      severity: warning
    annotations:
      summary: 'The gateway refused calls from {{ $labels.project }}: request limit or budget reached'
      description: '{{ $value | printf "%.0f" }} calls got 429 in 10 minutes. limits and budget are in projects/{{ $labels.project }}.yaml.'
  - alert: GatewayUpstreamThrottled
    expr: sum by (backend) (increase(agentgateway_requests_total{gateway="mini-platform/agentgateway-proxy",reason="Upstream",status="429"}[15m])) >= 5
    labels:
      severity: warning
    annotations:
      summary: '{{ $labels.backend }} is throttling the gateway (429 from the provider)'
      description: '{{ $value | printf "%.0f" }} calls got 429 from the provider in 15 minutes. For Vertex models, check the project''s quota in the GCP console.'
