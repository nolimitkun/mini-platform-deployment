{{- $auth := .Values.vault.auth }}
{{- if .Values.vaultAuthServiceAccount }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ $auth.serviceAccount }}
  namespace: {{ .Release.Namespace }}
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
{{- end }}
{{- /*
  VSO looks up a VaultStaticSecret's vaultAuthRef in the secret's own namespace,
  and the VaultAuth in turn authenticates with a ServiceAccount from that same
  namespace. A secret destined for another namespace therefore needs both
  rendered there as well; the operator's own defaultAuthMethod only covers the
  release namespace.
*/}}
{{- $namespaces := list }}
{{- range .Values.externalVaultSecrets }}
{{- $namespaces = append $namespaces .namespace }}
{{- end }}
{{- range $ns := $namespaces | uniq }}
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ $auth.serviceAccount }}
  namespace: {{ $ns }}
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
---
apiVersion: secrets.hashicorp.com/v1beta1
kind: VaultAuth
metadata:
  name: {{ $.Values.vault.vaultAuthRef }}
  namespace: {{ $ns }}
  annotations:
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
    argocd.argoproj.io/sync-wave: "-1"
spec:
  method: {{ $auth.method }}
  mount: {{ $auth.mount }}
  kubernetes:
    role: {{ $auth.role }}
    serviceAccount: {{ $auth.serviceAccount }}
    audiences:
      - {{ $auth.audience }}
{{- end }}
