{{- $vault := .Values.vault }}
{{- range .Values.vaultSecrets }}
---
apiVersion: secrets.hashicorp.com/v1beta1
kind: VaultStaticSecret
metadata:
  name: {{ . }}
  namespace: {{ $.Release.Namespace }}
  annotations:
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
    # Ahead of the workload in the same Application, so the Secret exists (or is
    # at least on its way) before the pod that mounts it is created. A missing
    # Secret does not fail the pod outright -- the kubelet retries until it
    # appears -- but ordering keeps a first sync from looking broken.
    argocd.argoproj.io/sync-wave: "-1"
spec:
  vaultAuthRef: {{ $vault.vaultAuthRef }}
  type: kv-v2
  mount: {{ $vault.mount }}
  path: {{ . }}
  refreshAfter: {{ $vault.refreshAfter }}
  destination:
    name: {{ . }}
    create: true
    overwrite: true
{{- end }}
{{- range .Values.externalVaultSecrets }}
---
apiVersion: secrets.hashicorp.com/v1beta1
kind: VaultStaticSecret
metadata:
  name: {{ .name }}
  namespace: {{ .namespace }}
  annotations:
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
    argocd.argoproj.io/sync-wave: "-1"
spec:
  vaultAuthRef: {{ $vault.vaultAuthRef }}
  type: kv-v2
  mount: {{ $vault.mount }}
  path: {{ .name }}
  refreshAfter: {{ $vault.refreshAfter }}
  destination:
    name: {{ .name }}
    create: true
    overwrite: true
    {{- with .labels }}
    labels:
      {{- toYaml . | nindent 6 }}
    {{- end }}
{{- end }}
