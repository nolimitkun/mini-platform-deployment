{{- $vault := .Values.vault }}
{{- /*
  An entry is a Vault path's name (the Secret gets every field), {name, refreshAfter},
  or a copy of one gateway key: {name, gatewayKey, field}. The project registry writes every gateway
  API key, by key id, to one map (vault.gatewayKeys); the copy picks one key id out
  of it and names the field its consumer reads, so no other Vault path holds a key.
*/}}
{{- define "app-resources.gatewayKeyCopy" }}
  {{- if .gatewayKey }}
    transformation:
      excludeRaw: true
      excludes: [".*"]
      templates:
        {{ required "a gateway key copy needs field" .field }}:
          text: {{ printf "{{ get .Secrets %q }}" .gatewayKey | quote }}
  {{- end }}
{{- end }}
{{- range .Values.vaultSecrets }}
{{- $e := . }}{{ if kindIs "string" . }}{{ $e = dict "name" . }}{{ end }}
---
apiVersion: secrets.hashicorp.com/v1beta1
kind: VaultStaticSecret
metadata:
  name: {{ $e.name }}
  namespace: {{ $.Release.Namespace }}
  annotations:
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
    # Ahead of the workload in the same Application, so the Secret exists (or is
    # at least on its way) before the pod that mounts it is created. A missing
    # Secret does not fail the pod outright -- the kubelet retries until it
    # appears -- but ordering keeps a first sync from looking broken.
    argocd.argoproj.io/sync-wave: "-1"
spec:
  vaultAuthRef: {{ $vault.vaultAuthRef }}
  type: kv-v2
  mount: {{ $vault.mount }}
  path: {{ if $e.gatewayKey }}{{ $vault.gatewayKeys }}{{ else }}{{ $e.name }}{{ end }}
  refreshAfter: {{ $e.refreshAfter | default (ternary $vault.gatewayKeysRefreshAfter $vault.refreshAfter (not (empty $e.gatewayKey))) }}
  destination:
    name: {{ $e.name }}
    create: true
    overwrite: true
    {{- include "app-resources.gatewayKeyCopy" $e }}
{{- end }}
{{- range .Values.externalVaultSecrets }}
---
apiVersion: secrets.hashicorp.com/v1beta1
kind: VaultStaticSecret
metadata:
  name: {{ .name }}
  namespace: {{ .namespace }}
  annotations:
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
    argocd.argoproj.io/sync-wave: "-1"
spec:
  vaultAuthRef: {{ $vault.vaultAuthRef }}
  type: kv-v2
  mount: {{ $vault.mount }}
  path: {{ if .gatewayKey }}{{ $vault.gatewayKeys }}{{ else }}{{ default .name .path }}{{ end }}
  refreshAfter: {{ .refreshAfter | default (ternary $vault.gatewayKeysRefreshAfter $vault.refreshAfter (not (empty .gatewayKey))) }}
  destination:
    name: {{ .name }}
    create: true
    overwrite: true
    {{- with .labels }}
    labels:
      {{- toYaml . | nindent 6 }}
    {{- end }}
    {{- include "app-resources.gatewayKeyCopy" . }}
{{- end }}
