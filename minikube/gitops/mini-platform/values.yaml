# Two Git sources back this overlay (see scripts/set-repo.sh to change them):
#   chartsRepo  - vendored upstream Helm charts (the charts/ tree).
#   deployRepo  - this deployment repo (minikube/ overlay + gitops wiring).
# Each generated Argo CD Application is multi-source: it pulls its chart from
# the relevant repo and its values file from deployRepo via the $deploy ref.
chartsRepo: https://github.com/nolimitkun/mini-platform.git
chartsRevision: main
deployRepo: https://github.com/nolimitkun/mini-platform-deployment.git
deployRevision: main

argoNamespace: argocd
destination:
  server: https://kubernetes.default.svc
  namespace: mini-platform

# Shared first-party chart rendered as a second source on every application that
# declares a `resourcesFile`. It turns that file's `routes` into Ingresses and
# its `vaultSecrets` into VaultStaticSecret mappings, inside the application
# that owns them.
resourcesChartPath: minikube/gitops/app-resources

applications:
  argocd:
    chartPath: charts/argo-cd
    valuesFile: minikube/values/argo-cd-values.yaml
    namespace: argocd
    releaseName: argocd
    wave: "-5"
  vault:
    chartPath: charts/vault
    valuesFile: minikube/values/vault-values.yaml
    wave: "-4"
  vault-secrets-operator:
    chartPath: charts/vault-secrets-operator
    valuesFile: minikube/values/vault-secrets-operator-values.yaml
    resourcesFile: minikube/values/vault-secrets-operator-resources.yaml
    wave: "-4"
  # CRDs only, in their own release ahead of every workload wave so the Agent,
  # ModelConfig, and MCPServer types exist before the kagent release below
  # creates instances of them.
  kagent-crds:
    chartPath: charts/kagent-crds
    valuesFile: minikube/values/kagent-crds-values.yaml
    releaseName: kagent-crds
    wave: "-4"
  postgresql:
    chartPath: charts/postgresql
    valuesFile: minikube/values/postgresql-values.yaml
    resourcesFile: minikube/values/postgresql-resources.yaml
    wave: "-3"
  redis:
    chartPath: charts/redis
    valuesFile: minikube/values/redis-values.yaml
    resourcesFile: minikube/values/redis-resources.yaml
    wave: "-3"
  qdrant:
    chartPath: charts/qdrant
    valuesFile: minikube/values/qdrant-values.yaml
    wave: "-3"
    ignoreDifferences:
      - group: apps
        kind: StatefulSet
        jsonPointers:
          - /spec/persistentVolumeClaimRetentionPolicy
          - /spec/volumeClaimTemplates
  spark-operator:
    chartPath: charts/spark-operator
    valuesFile: minikube/values/spark-operator-values.yaml
    wave: "-3"
  keycloak:
    chartPath: charts/keycloak
    valuesFile: minikube/values/keycloak-values.yaml
    resourcesFile: minikube/values/keycloak-resources.yaml
    wave: "-2"
  # Object store. Not a dependency of anything here — MLflow and Langfuse each
  # ship their own MinIO subchart — so its wave is chosen entirely by what it
  # consumes: the client secret in keycloak-sso, and Keycloak itself. MinIO
  # resolves the OIDC discovery URL exactly once, at startup, and simply carries
  # on without a provider if that lookup fails, leaving the console on
  # username/password with no SSO button until the process is restarted. Sharing
  # Keycloak's wave lost that race every time — MinIO is serving in seconds,
  # Keycloak has a database and a realm import ahead of it — so it goes one wave
  # later. That closes the ordering failure but not the transient ones; see
  # minio-values.yaml and ensure_minio_sso in scripts/deploy-minikube.sh.
  minio:
    chartPath: charts/minio
    valuesFile: minikube/values/minio-values.yaml
    resourcesFile: minikube/values/minio-resources.yaml
    wave: "-1"
  langfuse:
    chartPath: charts/langfuse
    valuesFile: minikube/values/langfuse-values.yaml
    resourcesFile: minikube/values/langfuse-resources.yaml
    wave: "-2"
  # Langfuse headless initialization supports one project only. This
  # idempotent job provisions the second, Holmes-only project after Langfuse
  # and its VaultStaticSecrets are healthy.
  langfuse-holmes-project:
    chartPath: minikube/gitops/langfuse-project
    valuesFile: minikube/gitops/langfuse-project/values.yaml
    releaseName: langfuse-holmes-project
    wave: "-1"
  mlflow:
    chartPath: charts/mlflow
    valuesFile: minikube/values/mlflow-values.yaml
    resourcesFile: minikube/values/mlflow-resources.yaml
    wave: "-2"
  trino:
    chartPath: charts/trino
    valuesFile: minikube/values/trino-values.yaml
    wave: "-2"
  vllm:
    chartPath: charts/vllm-stack
    valuesFile: minikube/values/vllm-values.yaml
    resourcesFile: minikube/values/vllm-resources.yaml
    wave: "-2"
  # Alternative inference path: llm-d (GAIE standalone scheduler + vLLM decode
  # pods). Disabled by default — the node's single GPU cannot host llm-d and
  # production-stack (vllm) at the same time. To switch paths, set
  # enabled: true here AND servingEngineSpec.modelSpec[0].replicaCount: 0 in
  # minikube/values/vllm-values.yaml (or the reverse), then commit and push.
  llm-d-modelserver:
    enabled: false
    chartPath: minikube/gitops/llm-d-modelserver
    valuesFile: minikube/gitops/llm-d-modelserver/values.yaml
    releaseName: llm-d-modelserver
    wave: "-2"
  llm-d-scheduler:
    enabled: false
    chartPath: charts/llm-d-scheduler
    valuesFile: minikube/values/llm-d-scheduler-values.yaml
    releaseName: llm-d
    wave: "-1"
  prometheus:
    chartPath: charts/prometheus
    valuesFile: minikube/values/prometheus-values.yaml
    resourcesFile: minikube/values/prometheus-resources.yaml
    wave: "-1"
    ignoreDifferences:
      - group: apps
        kind: StatefulSet
        jsonPointers:
          - /spec/persistentVolumeClaimRetentionPolicy
          - /spec/volumeClaimTemplates
  loki:
    chartPath: charts/loki
    valuesFile: minikube/values/loki-values.yaml
    wave: "-1"
    ignoreDifferences:
      - group: apps
        kind: StatefulSet
        jsonPointers:
          - /spec/persistentVolumeClaimRetentionPolicy
          - /spec/volumeClaimTemplates
  tempo:
    chartPath: charts/tempo
    valuesFile: minikube/values/tempo-values.yaml
    wave: "-1"
    ignoreDifferences:
      - group: apps
        kind: StatefulSet
        jsonPointers:
          - /spec/persistentVolumeClaimRetentionPolicy
          - /spec/volumeClaimTemplates
  grafana:
    chartPath: charts/grafana
    valuesFile: minikube/values/grafana-values.yaml
    resourcesFile: minikube/values/grafana-resources.yaml
    wave: "0"
  # Log shipper for Loki. Ordered after Loki so its first push has somewhere to
  # land.
  alloy:
    chartPath: charts/alloy
    valuesFile: minikube/values/alloy-values.yaml
    wave: "0"
  jupyterhub:
    chartPath: charts/jupyterhub
    valuesFile: minikube/values/jupyterhub-values.yaml
    resourcesFile: minikube/values/jupyterhub-resources.yaml
    wave: "0"
  superset:
    chartPath: charts/superset
    valuesFile: minikube/values/superset-values.yaml
    resourcesFile: minikube/values/superset-resources.yaml
    wave: "0"
    ignoreDifferences:
      - group: apps
        kind: StatefulSet
        jsonPointers:
          - /spec/persistentVolumeClaimRetentionPolicy
          - /spec/volumeClaimTemplates
  litellm:
    chartPath: charts/litellm-helm
    valuesFile: minikube/values/litellm-values.yaml
    resourcesFile: minikube/values/litellm-resources.yaml
    wave: "1"
  open-webui:
    chartPath: charts/open-webui
    valuesFile: minikube/values/open-webui-values.yaml
    resourcesFile: minikube/values/open-webui-resources.yaml
    wave: "2"
  # After LiteLLM (its model endpoint) and Grafana (its telemetry access), both
  # of which the agents call on startup.
  kagent:
    chartPath: charts/kagent
    valuesFile: minikube/values/kagent-values.yaml
    resourcesFile: minikube/values/kagent-resources.yaml
    releaseName: kagent
    wave: "2"
  # LLM root-cause analysis over the cluster and its telemetry. Ordered
  # alongside kagent and for the same reasons: it calls LiteLLM for its model
  # and Grafana's datasource proxy for Loki and Tempo, and its toolsets run a
  # health check against both when the pod starts.
  holmes:
    chartPath: charts/holmes
    valuesFile: minikube/values/holmes-values.yaml
    resourcesFile: minikube/values/holmes-resources.yaml
    releaseName: holmes
    wave: "2"
  # LiteLLM's A2A-facing adapter for the Holmes /api/chat API. It waits until
  # the Holmes application and its Vault-managed API key are healthy, then
  # serves the agent card registered in litellm-values.yaml.
  holmes-a2a:
    chartPath: minikube/gitops/holmes-a2a
    valuesFile: minikube/gitops/holmes-a2a/values.yaml
    releaseName: holmes-a2a
    wave: "3"
  # Forward-auth for MLflow, kagent and the LiteLLM UI. Fails its OIDC discovery
  # call and restarts until Keycloak (wave -2) has finished importing the realm,
  # so it is ordered late. The routes that name it as an auth backend are
  # rendered with their own applications, some of them several waves earlier —
  # those hosts answer 503 on their protected paths until this release is up.
  oauth2-proxy:
    chartPath: charts/oauth2-proxy
    valuesFile: minikube/values/oauth2-proxy-values.yaml
    resourcesFile: minikube/values/oauth2-proxy-resources.yaml
    releaseName: oauth2-proxy
    wave: "2"
