# Edited by hand: it lists no project (the project registry's records reach the
# gateway through OPA).
# envoyproxy/ratelimit config for the gateway's per-project limits. The limits
# themselves come from OPA with each request (limitOverride); the entry below
# refuses a descriptor sent without one.
domain: agentgateway
descriptors:
- key: project
  descriptors:
  - key: kind
    value: requests
    rate_limit:
      unit: minute
      requests_per_unit: 0
