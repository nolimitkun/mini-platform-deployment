{{- $v := .Values }}
# TLS for the webhook: a self-signed certificate for the Service's name, its CA
# injected into the ValidatingWebhookConfiguration by cert-manager's cainjector.
apiVersion: cert-manager.io/v1
kind: Issuer
metadata:
  name: opa-admission-selfsigned
spec:
  selfSigned: {}
---
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: opa-admission-tls
spec:
  secretName: opa-admission-tls
  dnsNames:
    - opa-admission.{{ .Release.Namespace }}.svc
    - opa-admission.{{ .Release.Namespace }}.svc.cluster.local
  issuerRef: {name: opa-admission-selfsigned, kind: Issuer}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: opa-admission
  labels: {app.kubernetes.io/name: opa-admission}
spec:
  replicas: {{ $v.admission.replicas }}
  selector:
    matchLabels: {app.kubernetes.io/name: opa-admission}
  template:
    metadata:
      labels: {app.kubernetes.io/name: opa-admission}
      annotations:
        checksum/config: {{ include (print $.Template.BasePath "/admission-config.yaml") . | sha256sum | trunc 16 }}
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        fsGroup: 1000
        seccompProfile: {type: RuntimeDefault}
      containers:
        - name: opa
          image: {{ $v.admission.image }}
          args:
            - run
            - --server
            - --addr=0.0.0.0:8443
            - --diagnostic-addr=0.0.0.0:8282
            - --tls-cert-file=/tls/tls.crt
            - --tls-private-key-file=/tls/tls.key
            - --config-file=/config/config.yaml
            - --set=persistence_directory=/var/opa
          env:
            - {name: AWS_REGION, value: {{ $v.minio.region | quote }}}
          envFrom:
            - secretRef: {name: {{ $v.minio.readerSecret }}}
          ports:
            - {name: https, containerPort: 8443}
            - {name: diag, containerPort: 8282}
          # Ready once the bundle is loaded; until then the API server's call fails
          # and the webhook's failurePolicy (Ignore) admits.
          readinessProbe:
            httpGet: {path: "/health?bundles", port: diag}
          livenessProbe:
            httpGet: {path: /health, port: diag}
          resources:
            requests: {cpu: 20m, memory: 64Mi}
            limits: {memory: 256Mi}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: {drop: [ALL]}
          volumeMounts:
            - {name: config, mountPath: /config, readOnly: true}
            - {name: tls, mountPath: /tls, readOnly: true}
            - {name: persist, mountPath: /var/opa}
      volumes:
        - name: config
          configMap: {name: opa-admission-config}
        - name: tls
          secret: {secretName: opa-admission-tls}
        - name: persist
          emptyDir: {}
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: opa-admission
spec:
  minAvailable: 1
  selector:
    matchLabels: {app.kubernetes.io/name: opa-admission}
---
apiVersion: v1
kind: Service
metadata:
  name: opa-admission
  labels: {app.kubernetes.io/name: opa-admission}
spec:
  selector: {app.kubernetes.io/name: opa-admission}
  ports:
    - {name: https, port: 443, targetPort: https}
---
# Report-only until a rule is enforced (the policy's admission config.enforce): the
# API server shows the fleet's warnings to whoever applies (kubectl, Argo CD).
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingWebhookConfiguration
metadata:
  name: opa-admission
  annotations:
    cert-manager.io/inject-ca-from: {{ .Release.Namespace }}/opa-admission-tls
    # After the fleet and its certificate, so the first calls find them.
    argocd.argoproj.io/sync-wave: "1"
webhooks:
  - name: platform.opa-admission.mini-platform
    admissionReviewVersions: [v1]
    sideEffects: None
    failurePolicy: {{ $v.admission.failurePolicy }}
    timeoutSeconds: {{ $v.admission.timeoutSeconds }}
    clientConfig:
      service:
        name: opa-admission
        namespace: {{ .Release.Namespace }}
        path: /
        port: 443
    namespaceSelector:
      matchExpressions:
        - key: kubernetes.io/metadata.name
          operator: In
          values: {{ toJson $v.admission.namespaces }}
    rules:
      - apiGroups: ["secrets.hashicorp.com"]
        apiVersions: ["*"]
        resources: [vaultstaticsecrets]
        operations: [CREATE, UPDATE]
      - apiGroups: ["serving.kserve.io"]
        apiVersions: ["*"]
        resources: [llminferenceservices]
        operations: [CREATE, UPDATE]
      - apiGroups: [""]
        apiVersions: [v1]
        resources: [pods]
        operations: [CREATE]
