ingressClassName: nginx

# Forward-auth target for routes that declare `protectedPaths`. oauth2-proxy
# holds the Keycloak session on behalf of components that cannot do OIDC
# themselves; see minikube/values/oauth2-proxy-values.yaml.
authProxy:
  service: oauth2-proxy
  port: 80
  # Served on each protected host, not on a host of its own — the session
  # cookie oauth2-proxy sets at the callback has to be same-origin with the
  # component it is protecting.
  path: /oauth2

# Only entry points intended for local user access are exposed. Stateful
# dependencies, Vault, Trino, Prometheus, and vLLM remain cluster-internal.
#
# `protectedPaths` puts the listed path prefixes behind Keycloak via
# oauth2-proxy. Everything else is either reachable without a login or
# authenticates the request itself.
routes:
  - name: open-webui
    host: open-webui.test
    service: open-webui
    port: 80
  - name: litellm
    host: litellm.test
    service: litellm
    port: 4000
    # The admin UI only. /v1 stays open because LiteLLM authenticates API
    # traffic itself with the master key and virtual keys — putting a browser
    # redirect in front of it would break every API client.
    protectedPaths:
      - /ui
  - name: langfuse
    host: langfuse.test
    service: langfuse-web
    port: 3000
  - name: mlflow
    host: mlflow.test
    service: mlflow-tracking
    port: 80
    # MLflow's own auth is a single basic-auth account with no OIDC support, so
    # the browser UI sits behind oauth2-proxy.
    protectedPaths:
      - /
    # ...but not the tracking API. The MLflow SDK and CLI send basic-auth
    # credentials and cannot follow an interactive SSO redirect, so leaving /api
    # protected turns every `mlflow.set_tracking_uri("http://mlflow.test")` into
    # a 302 at the ingress. MLflow authenticates these routes itself with the
    # account in mini-platform/mlflow-auth — the same split LiteLLM uses for
    # /v1 above. The UI's own /ajax-api calls stay protected; they come from a
    # browser that already holds the oauth2-proxy cookie.
    openPaths:
      - /api
  - name: grafana
    host: grafana.test
    service: grafana
    port: 80
  - name: jupyterhub
    host: jupyterhub.test
    service: proxy-public
    port: 80
  - name: superset
    host: superset.test
    service: superset
    port: 8088
  - name: minio
    host: minio.test
    service: minio-console
    port: 9001
  - name: keycloak
    host: keycloak.test
    service: keycloak
    port: 80
  # kagent's chat UI. The controller and MCP tool servers behind it stay
  # cluster-internal.
  - name: kagent
    host: kagent.test
    service: kagent-ui
    port: 8080
    # kagent ships no authentication whatsoever, so without this the chat UI —
    # and the cluster-mutating tools behind it — are open to anyone who can
    # reach the ingress.
    protectedPaths:
      - /
