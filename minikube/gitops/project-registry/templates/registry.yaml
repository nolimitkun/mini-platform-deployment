# Signs bundles with Vault Transit as this service account (Vault role
# bundle-signer, sign only).
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ .Values.serviceAccount }}
---
# Which OPA pods are ready (the opa Service's EndpointSlices): a change is
# active once all of them report its revision.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: project-registry-opa-pods
rules:
  - apiGroups: [discovery.k8s.io]
    resources: [endpointslices]
    verbs: [list]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: project-registry-opa-pods
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: project-registry-opa-pods
subjects:
  - kind: ServiceAccount
    name: {{ .Values.serviceAccount }}
---
{{- with .Values.gatewayModels.argoApp }}
{{- $app := splitList "/" . }}
# The publisher may ask Argo CD to refresh the gateway-models Application, and nothing
# else in Argo CD's namespace.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: project-registry-refresh-gateway-models
  namespace: {{ index $app 0 }}
rules:
  - apiGroups: [argoproj.io]
    resources: [applications]
    resourceNames: [{{ index $app 1 }}]
    verbs: [get, patch]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: project-registry-refresh-gateway-models
  namespace: {{ index $app 0 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: project-registry-refresh-gateway-models
subjects:
  - kind: ServiceAccount
    name: {{ $.Values.serviceAccount }}
    namespace: {{ $.Release.Namespace }}
---
{{- end }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: project-registry
  labels: {app.kubernetes.io/name: project-registry}
spec:
  replicas: 1
  selector:
    matchLabels: {app.kubernetes.io/name: project-registry}
  template:
    metadata:
      labels: {app.kubernetes.io/name: project-registry}
      annotations:
        # project_budget_usd for the one budget alert rule (alerts/agentgateway-projects.yml),
        # picked up by Prometheus's annotation-driven pod discovery.
        prometheus.io/scrape: "true"
        prometheus.io/port: "8080"
        prometheus.io/path: /metrics
    spec:
      {{- include "registry.pod" . | nindent 6 }}
      containers:
        - name: api
          {{- include "registry.container" . | nindent 10 }}
          command: [uvicorn, registry.api:app, --host, 0.0.0.0, --port, "8080"]
          env:
            {{- include "registry.env" (merge (dict "s3Secret" .Values.minio.apiSecret) .) | nindent 12 }}
            - {name: OPA_URL, value: {{ .Values.opaUrl | quote }}}
            - {name: KEYCLOAK_JWKS_URL, value: {{ .Values.keycloak.jwksUrl | quote }}}
            - {name: KEYCLOAK_ISSUER, value: {{ .Values.keycloak.issuer | quote }}}
            - {name: KEYCLOAK_CLIENT_ID, value: {{ .Values.keycloak.clientId | quote }}}
            - {name: USAGE_BUCKET, value: {{ .Values.usage.bucket | quote }}}
            - {name: USAGE_REFERENCE_MODEL, value: {{ .Values.usage.referenceModel | quote }}}
            - {name: PROMETHEUS_URL, value: {{ .Values.prometheusUrl | quote }}}
          ports:
            - {name: http, containerPort: 8080}
          readinessProbe:
            httpGet: {path: /healthz, port: http}
          resources:
            requests: {cpu: 50m, memory: 128Mi}
            limits: {memory: 512Mi}
---
apiVersion: v1
kind: Service
metadata:
  name: project-registry
  labels: {app.kubernetes.io/name: project-registry}
spec:
  selector: {app.kubernetes.io/name: project-registry}
  ports:
    - {name: http, port: 8080, targetPort: http}
---
# One publisher: publishes are serialized (bundle revisions are a sequence).
apiVersion: apps/v1
kind: Deployment
metadata:
  name: project-registry-publisher
  labels: {app.kubernetes.io/name: project-registry-publisher}
spec:
  replicas: 1
  strategy: {type: Recreate}
  selector:
    matchLabels: {app.kubernetes.io/name: project-registry-publisher}
  template:
    metadata:
      labels: {app.kubernetes.io/name: project-registry-publisher}
    spec:
      {{- include "registry.pod" . | nindent 6 }}
      containers:
        - name: publisher
          {{- include "registry.container" . | nindent 10 }}
          command: [python, -m, registry.publisher]
          env:
            {{- include "registry.env" . | nindent 12 }}
            - {name: LOKI_URL, value: {{ .Values.replay.lokiUrl | quote }}}
            - {name: REPLAY_SINCE, value: {{ .Values.replay.since | quote }}}
            - {name: REPLAY_LIMIT, value: {{ .Values.replay.limit | quote }}}
            - {name: MIN_INTERVAL, value: {{ .Values.publishInterval | quote }}}
            - {name: OPA_URL, value: {{ .Values.opaUrl | quote }}}
            - {name: POLICY_REF, value: {{ .Values.policy.ref | quote }}}
            - {name: POLICY_DIR, value: {{ .Values.policy.dir | quote }}}
            - {name: POLICY_POLL, value: {{ .Values.policy.poll | quote }}}
            - {name: AGENTREGISTRY_URL, value: {{ .Values.agentregistryUrl | quote }}}
            - {name: GATEWAY_MODELS_BUCKET, value: {{ .Values.gatewayModels.bucket | quote }}}
            - {name: GATEWAY_MODELS_ARGO_APP, value: {{ .Values.gatewayModels.argoApp | default "" | quote }}}
            - {name: GATEWAY_KEYS_MOUNT, value: {{ .Values.gatewayKeys.mount | quote }}}
          resources:
            requests: {cpu: 50m, memory: 128Mi}
            limits: {memory: 1Gi}
---
# The seed (files/seed.yaml), for the import job of a new cluster.
apiVersion: v1
kind: ConfigMap
metadata:
  name: project-registry-seed
data:
  seed.yaml: |
{{ .Files.Get "files/seed.yaml" | indent 4 }}
---
# First load of an empty registry: its latest snapshot in the bundle store, or
# else the seed; then the first signed gateway-projects bundle. Does nothing
# once the registry has records, so it can run on every sync.
apiVersion: batch/v1
kind: Job
metadata:
  name: project-registry-import
  annotations:
    argocd.argoproj.io/hook: PostSync
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation
spec:
  backoffLimit: 6
  template:
    spec:
      restartPolicy: OnFailure
      {{- include "registry.pod" . | nindent 6 }}
      containers:
        - name: import
          {{- include "registry.container" . | nindent 10 }}
          command: [python, -m, registry.importer, --owner-group, {{ .Values.import.ownerGroup | quote }}, --seed, /seed/seed.yaml]
          env:
            {{- include "registry.env" . | nindent 12 }}
---
# The daily snapshot of the records into the bundle store (registry-snapshots/),
# what an empty registry imports.
apiVersion: batch/v1
kind: CronJob
metadata:
  name: project-registry-snapshot
  labels: {app.kubernetes.io/name: project-registry-snapshot}
spec:
  schedule: {{ .Values.snapshot.schedule | quote }}
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 1
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 1
      activeDeadlineSeconds: 600
      template:
        metadata:
          labels: {app.kubernetes.io/name: project-registry-snapshot}
        spec:
          restartPolicy: Never
          {{- include "registry.pod" . | nindent 10 }}
          containers:
            - name: snapshot
              {{- include "registry.container" . | nindent 14 }}
              command: [python, -m, registry.snapshot]
              env:
                {{- include "registry.env" . | nindent 16 }}
              resources:
                requests: {cpu: 50m, memory: 128Mi}
                limits: {memory: 512Mi}
---
# The gateway's spend and usage: its access log (Loki) into Parquet (MinIO),
# shaped with DuckDB, for the portal's Usage page (registry/usage.py). Records
# its health as the publisher output "usage".
apiVersion: batch/v1
kind: CronJob
metadata:
  name: project-registry-usage
  labels: {app.kubernetes.io/name: project-registry-usage}
spec:
  schedule: {{ .Values.usage.schedule | quote }}
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 1
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 1
      activeDeadlineSeconds: 1800
      template:
        metadata:
          labels: {app.kubernetes.io/name: project-registry-usage}
        spec:
          restartPolicy: Never
          {{- include "registry.pod" . | nindent 10 }}
          containers:
            - name: usage
              {{- include "registry.container" . | nindent 14 }}
              command: [python, -m, registry.usage]
              env:
                {{- include "registry.env" . | nindent 16 }}
                - {name: USAGE_BUCKET, value: {{ .Values.usage.bucket | quote }}}
                - {name: LOKI_URL, value: {{ .Values.usage.lokiUrl | quote }}}
                - {name: USAGE_LOKI_SELECTOR, value: {{ .Values.usage.lokiSelector | quote }}}
                - {name: USAGE_LOOKBACK_HOURS, value: {{ .Values.usage.lookbackHours | quote }}}
                - {name: USAGE_BACKFILL_HOURS, value: {{ .Values.usage.backfillHours | quote }}}
                - {name: USAGE_DUCKDB_MEMORY, value: "512MB"}
              resources:
                requests: {cpu: 100m, memory: 256Mi}
                limits: {memory: 1Gi}
