# The registry API, the publisher and the one-off import, all one image
# (github.com/nolimitkun/project-registry). Design: docs/project-registry.md.
image: ghcr.io/nolimitkun/project-registry:sha-8485d196ef18c35fa95970412b379dd2e7299d36

# DATABASE_URL, from Vault (project-registry-db), for project-registry-postgresql.
databaseSecret: project-registry-db

# The deployment repo the publisher renders with: scripts/gen-projects.py and
# the catalog at the commit of the active policy bundle. Public, no credentials.
deployRepo: https://github.com/nolimitkun/mini-platform-deployment.git

# The policy the publisher follows: every new commit of this branch becomes a
# policy change request (kind policy), tested, built, signed and replayed, and
# OPA loads it once it is approved (docs/project-registry.md "Policy changes").
# A branch name, not a commit. To try a branch on the cluster, set it here for
# the test, and back to main before the merge.
policy:
  repo: https://github.com/nolimitkun/mini-platform-deployment.git
  ref: feat/policy-via-registry   # TEMPORARY: branch test, back to main before merge
  dir: policies/gateway
  testDirs: policies/gateway,policies/gateway-projects
  # how often the branch is checked (seconds)
  poll: "60"

# The bundle store and signing (OPA's side: opa-policy values.yaml).
bundles:
  policy: gateway-policy
  projects: gateway-projects
  prefix: ""
minio:
  url: http://minio.mini-platform.svc.cluster.local:9000
  bucket: opa-bundles
  region: us-east-1
  writerSecret: opa-bundles-writer
signing:
  vaultAddr: http://vault.mini-platform.svc.cluster.local:8200
  vaultRole: bundle-signer
  transitKey: opa-bundles
  # The Transit key version that signs, and the key id OPA knows it by. Both
  # change together with opa-policy's, in one commit (docs/project-registry.md
  # "Rotating the signing key").
  keyVersion: 2
  keyid: opa-bundles-v2
serviceAccount: project-registry

# Who may propose a change and who must approve it: data.portal.may_submit and
# data.portal.required_approvals on the gateway's OPA (its policy bundle
# carries policies/gateway/portal.rego).
opaUrl: http://opa.mini-platform.svc.cluster.local:8181

# People log in to Keycloak; the registry checks their access tokens (signed by
# the realm, issued to its client) and reads their groups.
keycloak:
  jwksUrl: http://keycloak.mini-platform.svc.cluster.local/realms/mini-platform/protocol/openid-connect/certs
  issuer: http://keycloak.test/realms/mini-platform
  clientId: project-registry

# The publisher replays this window of OPA's decision log (Loki) before every
# publish: a change may change decisions only for the projects it touches.
replay:
  lokiUrl: http://loki.mini-platform.svc.cluster.local:3100
  since: 24h
  limit: "2000"
# Approved changes are batched: at most one publish this often (seconds).
publishInterval: "30"

# The daily export to Git: the registry's records written to projects/ and
# agents/ by this repo's scripts/registry-export.py, as a pull request on the
# `registry-export` branch (one PR at a time, never merged by itself). Its token
# is in Vault (registry-git, GITHUB_TOKEN): a fine-grained token for this repo
# only, Contents and Pull requests read and write. Empty: the job does nothing.
gitExport:
  schedule: "0 3 * * *"
  repoSlug: nolimitkun/mini-platform-deployment
  base: main
  branch: registry-export
  secret: registry-git

# First load from projects/*.yaml (an Argo CD PostSync hook; does nothing once
# the registry has records): every imported project's owner group.
import:
  # project-owners (Keycloak): not platform-admins, so the platform team can
  # propose changes and an owner who isn't its author approves them.
  ownerGroup: project-owners
