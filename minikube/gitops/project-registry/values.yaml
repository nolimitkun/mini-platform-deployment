# The registry API, the publisher and the one-off import, all one image
# (github.com/nolimitkun/project-registry). Design: nolimitkun/project-registry docs/design.md.
image: ghcr.io/nolimitkun/project-registry:sha-dcaeac2b73e9f4907ac833a8a8beb97593451641

# DATABASE_URL, from Vault (project-registry-db), for project-registry-postgresql.
databaseSecret: project-registry-db

# The gateway policy (nolimitkun/gateway-policy): the Rego, the catalog and the
# record schemas. The publisher follows its branch: every new commit becomes a
# policy change request (kind policy), tested, built, signed and replayed, and
# OPA loads it once it is approved (nolimitkun/project-registry docs/design.md "Policy changes").
# The records render with its gen-projects.py, at the active policy's commit.
# Public, no credentials. ref: a branch name, not a commit. To try a branch on
# the cluster, set it here for the test, and back to main before the merge.
policy:
  repo: https://github.com/nolimitkun/gateway-policy.git
  # Where the policy lived before (its commits until 2026-11-14): the active
  # commit, or an older one a rollback activates, may only be there.
  fallbackRepos: https://github.com/nolimitkun/mini-platform-deployment.git
  ref: main
  dir: policies/gateway
  # how often the branch is checked (seconds)
  poll: "60"

# A proposed kagent agent must be wired to its own key in this repo's kagent
# values first (kagent-values.yaml modelConfigRef, a ModelConfig and the secret
# in kagent-resources.yaml): the registry checks it against this branch.
kagentWiring:
  repo: https://github.com/nolimitkun/mini-platform-deployment.git
  ref: main

# The gateway's model routes: once a policy commit is active, the publisher
# packages its charts/gateway-models with the catalog and publishes it to this
# bucket, a Helm repository the gateway-models application installs from
# (minio-values.yaml: anonymous download, the writer account may write it).
gatewayModels:
  bucket: gateway-models

# The bundle store and signing (OPA's side: opa-policy values.yaml).
bundles:
  policy: gateway-policy
  projects: gateway-projects
  prefix: ""
minio:
  url: http://minio.mini-platform.svc.cluster.local:9000
  bucket: opa-bundles
  region: us-east-1
  writerSecret: opa-bundles-writer
signing:
  vaultAddr: http://vault.mini-platform.svc.cluster.local:8200
  vaultRole: bundle-signer
  transitKey: opa-bundles
  # The Transit key version that signs, and the key id OPA knows it by. Both
  # change together with opa-policy's, in one commit (nolimitkun/project-registry docs/design.md
  # "Rotating the signing key").
  keyVersion: 2
  keyid: opa-bundles-v2
serviceAccount: project-registry

# Who may propose a change and who must approve it: data.portal.may_submit and
# data.portal.required_approvals on the gateway's OPA (its policy bundle
# carries gateway-policy's policies/gateway/portal.rego).
opaUrl: http://opa.mini-platform.svc.cluster.local:8181

# People log in to Keycloak; the registry checks their access tokens (signed by
# the realm, issued to its client) and reads their groups.
keycloak:
  jwksUrl: http://keycloak.mini-platform.svc.cluster.local/realms/mini-platform/protocol/openid-connect/certs
  issuer: http://keycloak.test/realms/mini-platform
  clientId: project-registry

# The publisher replays this window of OPA's decision log (Loki) before every
# publish: a change may change decisions only for the projects it touches.
replay:
  lokiUrl: http://loki.mini-platform.svc.cluster.local:3100
  since: 24h
  limit: "2000"
# Approved changes are batched: at most one publish this often (seconds).
publishInterval: "30"

# The records live only in the registry. Their copies: a daily snapshot into the
# bundle store (registry-snapshots/), what an empty registry imports, and the
# signed bundle revisions. Not a backup of the database (approvals, audit log).
snapshot:
  schedule: "0 3 * * *"

# The registry applies its registered agents to agentregistry's catalog after
# each publish and every hour (agentregistry-catalog has the static entries).
agentregistryUrl: http://agentregistry.mini-platform.svc.cluster.local:12121

# First load of an empty registry (an Argo CD PostSync hook; does nothing once
# it has records): its latest snapshot, or else files/seed.yaml on a new
# cluster. Every imported project's owner group:
import:
  # project-owners (Keycloak): not platform-admins, so the platform team can
  # propose changes and an owner who isn't its author approves them.
  ownerGroup: project-owners
