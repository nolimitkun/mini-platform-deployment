project:
  admin:
    budget:
      usd_per_30_days: 25
    data_class: public
    description: For people testing and operating the gateway by hand.
    keys:
    - admin
    limits:
      requests_per_minute: 60
    mcp_tools:
    - '*'
    owner: platform team
    project: admin
    routing: semantic
  holmes:
    budget:
      usd_per_30_days: 20
    data_class: internal
    description: HolmesGPT root-cause analysis. Its DeepSeek exception is in _exceptions.yaml.
    keys: []
    limits:
      requests_per_minute: 30
    mcp_tools:
    - grafana_*
    owner: platform team
    project: holmes
  kagent:
    budget:
      usd_per_30_days: 30
    data_class: internal
    description: kagent's agents. Its DeepSeek exception is in _exceptions.yaml.
    keys:
    - kagent
    limits:
      requests_per_minute: 60
    mcp_tools:
    - grafana_*
    - kagent-tools_*
    owner: platform team
    project: kagent
  model-onboarding:
    data_class: internal
    deployments: true
    description: The model onboarding pipeline (github.com/nolimitkun/model-onboarding-pipeline). It tunes, evaluates and
      smoke-tests each model deployment it makes through the gateway, by the deployment's own path, before the catalog names
      it.
    keys:
    - model-onboarding
    models:
      allow:
      - qwen3.6-27b
    owner: platform team
    placement:
    - onprem
    project: model-onboarding
  open-webui:
    budget:
      usd_per_30_days: 50
    data_class: internal
    description: Open WebUI, the platform's chat front end for people.
    keys:
    - open-webui
    limits:
      requests_per_minute: 120
    owner: platform team
    project: open-webui
    routing: semantic
