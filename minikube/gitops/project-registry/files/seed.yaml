# The platform's own projects, agents and exceptions, and the catalog (models, Google
# APIs, MCP tools, its settings), loaded into an EMPTY project
# registry on a new cluster (the import job, registry/importer.py). Not a copy
# of the registry: once it has records, the registry is their only source, and
# this file is never read again (a registry that lost its database imports its
# latest snapshot from the bundle store instead). It is also what CI renders to
# test the policy with (scripts/validate-gitops.sh).
#
# Format: the registry's GET /export without "revision". Each project, agent and
# exception has the format of gateway-policy's projects/schema.json and
# agents/schema.json; the catalog's records, of what its gen-catalog.py validates.
agent:
  holmes:
    agent: holmes
    autonomy: supervised
    description: Root-cause analysis of alerts and incidents from cluster state, logs, metrics, traces and Argo CD (HolmesGPT).
    keys:
    - holmes
    mcp_tools:
    - grafana_*
    models:
      allow:
      - deepseek-v4-pro
    owner: platform team
    project: holmes
    runtime:
      kind: holmes
      name: holmes
    secret:
      field: AGENTGATEWAY_API_KEY
      name: holmes-agentgateway
  kagent-helm-agent:
    agent: kagent-helm-agent
    autonomy: autonomous
    description: Lists, installs, upgrades and rolls back Helm releases (kagent's helm-agent).
    keys:
    - kagent-helm-agent
    models:
      allow:
      - deepseek-v4-pro
    owner: platform team
    project: kagent
    runtime:
      kind: kagent
      name: helm-agent
    secret:
      field: OPENAI_API_KEY
      name: kagent-helm-agent-agentgateway
  kagent-k8s-agent:
    agent: kagent-k8s-agent
    autonomy: autonomous
    description: Inspects and changes Kubernetes resources in the cluster on request (kagent's k8s-agent).
    keys:
    - kagent-k8s-agent
    models:
      allow:
      - deepseek-v4-pro
    owner: platform team
    project: kagent
    runtime:
      kind: kagent
      name: k8s-agent
    secret:
      field: OPENAI_API_KEY
      name: kagent-k8s-agent-agentgateway
  kagent-observability-agent:
    agent: kagent-observability-agent
    autonomy: read-only
    description: Answers questions from Prometheus metrics and Grafana dashboards (kagent's observability-agent).
    keys:
    - kagent-observability-agent
    models:
      allow:
      - deepseek-v4-pro
    owner: platform team
    project: kagent
    runtime:
      kind: kagent
      name: observability-agent
    secret:
      field: OPENAI_API_KEY
      name: kagent-observability-agent-agentgateway
  kagent-promql-agent:
    agent: kagent-promql-agent
    autonomy: read-only
    description: Writes PromQL queries from a plain-language question (kagent's promql-agent).
    keys:
    - kagent-promql-agent
    models:
      allow:
      - deepseek-v4-pro
    owner: platform team
    project: kagent
    runtime:
      kind: kagent
      name: promql-agent
    secret:
      field: OPENAI_API_KEY
      name: kagent-promql-agent-agentgateway
catalog:
  settings:
    servingNamespaces:
    - model-hprd
    - model-prod
    targets:
    - grafana
    - kagent-tools
    tasks:
      code:
      - deepseek-v4-pro
      - gemini-3.8-flash
      - qwen3.6-27b
      general:
      - gemini-3.5-flash-lite
      - qwen3.6-27b
      reasoning:
      - gemini-4-argon
      - deepseek-v4-pro
      - qwen3.6-27b
exception:
  holmes:
    models:
    - deepseek-v4-pro
    owner: platform team
    why: 'same as kagent: root-cause analysis over cluster state and telemetry'
  kagent:
    models:
    - deepseek-v4-pro
    owner: platform team
    why: multi-step tool calling the single-GPU local model can't carry; cluster state and telemetry only
