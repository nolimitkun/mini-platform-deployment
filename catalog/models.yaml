# The platform's model catalog: the one place a model or a Google API is
# declared. Both the gateway and the gateway policy are generated from it, so
# a model can't be routable without a placement, or allowed without a route.
#
# After editing, run:  python3 scripts/gen-catalog.py
# It validates this file and writes
#   minikube/gitops/agentgateway-config/files/catalog.json  (gateway: models, Google API routes)
#   policies/gateway/catalog/data.json                     (OPA: data.catalog)
# CI (scripts/validate-gitops.sh) fails if either is out of date.
#
# price: USD per million tokens, input and output, as agentgateway v1.7.0's
# built-in price table bills them (the same rates behind its cost metrics; checked
# against agentgateway_gen_ai_client_cost_usd_total). Self-hosted models have no
# per-token charge. The policy's "cheapest" routing ranks by these.
#
# placement: where the data goes. The data classes in policies/gateway/data.json
# decide which placements a client may use.
#   onprem    on this cluster
#   gcp       Google, over the VPN and PSC (mini-cloud)
#   external  a third-party API over the internet

# placement onprem also covers the KServe releases below (provider KServe).
#
# Where self-hosted models are served: KServe LLMInferenceServices that the
# model onboarding pipeline deploys (minikube/gitops/model-serving), its
# candidates and tuning trials in model-hprd, its releases in model-prod. Routes
# from these namespaces may attach to the gateway. Each deployment is reachable
# by KServe's own path route, /<namespace>/<name>/v1/..., which only projects
# with `deployments: true` may call (the pipeline, to evaluate and smoke-test
# exactly what it deployed); clients use a release by its name below.
servingNamespaces:
  - model-hprd
  - model-prod

# Chat and embedding models. Clients send the key as `model` to the
# OpenAI-compatible endpoint /v1/chat/completions; one AgentgatewayModel each.
models:
  # On the local GPU: the model onboarding pipeline's release in model-prod
  # (KServe LLMInferenceService, weights from MinIO). A new release is a new
  # deployment / servedModel here; clients keep calling qwen3.6-27b.
  qwen3.6-27b:
    placement: onprem
    provider: KServe
    deployment: model-prod/unsloth-qwen3-6-27b-nvfp4-ccdaab7e-e8eb38
    servedModel: unsloth/Qwen3.6-27B-NVFP4@ccdaab7e68af2409599b8949a8f2685703c9bae5
    price: {input: 0, output: 0}

  # Hosted, over the internet. The key comes from Vault (agentgateway-deepseek).
  deepseek-v4-pro:
    placement: external
    provider: Deepseek
    secretRef: agentgateway-deepseek
    price: {input: 0.66, output: 1.98}

  # Gemini on Vertex AI, eu multi-region. agentgateway calls
  # aiplatform.eu.rep.googleapis.com, which scripts/gcp-psc-dns.sh pins to
  # mini-cloud's regional PSC endpoint, so the traffic stays on the VPN.
  gemini-4-argon:
    placement: gcp
    provider: VertexAI
    region: eu
    price: {input: 2, output: 10}
  gemini-3.8-flash:
    placement: gcp
    provider: VertexAI
    region: eu
    price: {input: 0.75, output: 3.75}
  gemini-3.5-flash:
    placement: gcp
    provider: VertexAI
    region: eu
    price: {input: 1.5, output: 9}
  gemini-3.5-flash-lite:
    placement: gcp
    provider: VertexAI
    region: eu
    price: {input: 0.3, output: 2.5}

# Task classes for model "auto" with semantic routing: the vLLM Semantic Router
# names the class of a prompt, and the policy tries these models in order,
# keeping only those the project may use. A project with none of them left gets
# its cheapest allowed model.
tasks:
  code: [deepseek-v4-pro, gemini-3.8-flash, qwen3.6-27b]
  reasoning: [gemini-4-argon, deepseek-v4-pro, qwen3.6-27b]
  general: [gemini-3.5-flash-lite, qwen3.6-27b]

# Google's own APIs, passed through unchanged with the keyless login added:
# clients call /google/<name>/<the API's own path>. Every host is pinned to a
# PSC endpoint by scripts/gcp-psc-dns.sh.
googleApis:
  # Speech-to-Text v2 (Chirp 3), eu.
  speech:
    placement: gcp
    host: eu-speech.googleapis.com
  # Text-to-Speech (Chirp 3 HD voices), eu.
  tts:
    placement: gcp
    host: eu-texttospeech.googleapis.com
  # Vertex AI in the eu multi-region: Gemini TTS through generateContent.
  vertex-eu:
    placement: gcp
    host: aiplatform.eu.rep.googleapis.com
  # Vertex AI in europe-west1: the Gemini Live websocket. A websocket upgrade
  # can't travel over the HTTP/2 connection the gateway otherwise negotiates,
  # and Google answers the bare GET with a 404, so this one is HTTP/1.1.
  vertex-europe-west1:
    placement: gcp
    host: europe-west1-aiplatform.googleapis.com
    http1Only: true
