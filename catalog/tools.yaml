# Every MCP tool behind the gateway's /mcp, with the most it can do. OPA holds
# a registered agent (an agent record in the project registry) to its autonomy with this:
#
#   read          only reads             read-only, supervised and autonomous agents
#   write         changes something it   autonomous agents; a supervised agent
#                 can be changed back    needs a human approval (refused today)
#   irreversible  deletes, executes      no agent on its own: needs an approval
#                 arbitrary commands or
#                 API calls, uninstalls
#
# A tool not listed here counts as irreversible. The servers' own MCP
# annotations are not trusted: kagent-tools marks every tool destructive, and
# Grafana's alerting_manage_routing claims read-only while it can change
# routing. A tool that can do several things is classed by the worst of them.
#
# fingerprint (quoted, so YAML keeps it a string): the first 16 hex digits of sha256 over the tool's description
# and input schema as the server announces them. scripts/tools-drift.py
# compares them with the live servers, so a tool that appears, disappears or
# changes what it says it does is reviewed before an agent relies on it.
#
# scripts/gen-catalog.py writes the risks into the policy's data.catalog.tools.
